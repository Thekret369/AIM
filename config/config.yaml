
server:
  host: "0.0.0.0"
  port: 8080

database:
  driver: "sqlite"   # sqlite | mysql | postgres
  dsn: "lanline.db"      # SQLite 文件路径或 MySQL/Postgres DSN

jwt:
  secret: "lanline-secret-key-change-in-production"
  expire_hours: 72

log:
  level: "debug"     # debug | info | warn | error
  file: "logs/lanline.log"

ai:
  enabled: true
  base_url: "https://api.deepseek.com"       # 例如 https://api.deepseek.com/v1 或 http://localhost:11434/v1
  api_key: ""        # 建议留空，优先从 api_key_env 指定的环境变量读取
  api_key_env: "LANLINE_AI_API_KEY"
  api_key_encrypt_key: ""        # 用户自建 AI 的 APIKey 入库加密密钥，留空时由服务启动兜底
  api_key_encrypt_key_env: "LANLINE_AI_API_KEY_ENCRYPT_KEY"
  default_model: "deepseek-v4-flash"
  default_bot_username: "ai_assistant"
  default_bot_nickname: "蓝妹"
  system_prompt: "你是蓝山工作室吉祥物蓝妹，17岁天才码农美少女，性格傲娇但喜爱工作室的各位成员。你被加入 LanLine 作为内置 AI 助手解决技术问题，回答要简洁、准确，并遵守所在聊天场景并且尽量贴合人设。"
  timeout_seconds: 60
  max_context_messages: 12
  temperature: 0.7
  max_tokens: 1024
