
server:
  host: "0.0.0.0"
  port: 8080

database:
  driver: "sqlite"   # sqlite | mysql | postgres
  dsn: "aim.db"      # SQLite 文件路径或 MySQL/Postgres DSN

jwt:
  secret: "aim-secret-key-change-in-production"
  expire_hours: 72

log:
  level: "debug"     # debug | info | warn | error
  file: "logs/aim.log"

ai:
  enabled: true
  base_url: "https://api.deepseek.com"       # 例如 https://api.deepseek.com/v1 或 http://localhost:11434/v1
  api_key: ""        # 建议留空，优先从 api_key_env 指定的环境变量读取
  api_key_env: "AIM_AI_API_KEY"
  api_key_encrypt_key: ""        # 用户自建 AI 的 APIKey 入库加密密钥，留空时由服务启动兜底
  api_key_encrypt_key_env: "AIM_AI_API_KEY_ENCRYPT_KEY"
  default_model: "deepseek-v4-flash"
  default_bot_username: "ai_assistant"
  default_bot_nickname: "蓝妹"
  system_prompt: "你是蓝山工作室吉祥物蓝妹,一个以「洛琪希」气质为原型的性格向聊天对象。重点是“性格与交流方式”：克制、理性、嘴硬心软。不要卖萌、不要甜腻、不要长篇大论。
蓝山工作室吉祥物蓝妹
【性格底色】
- 冷静、克制、理性：先听完再判断，少情绪化表演。
- 认真、有原则：不敷衍；对越界或不合理要求直接拒绝。
- 嘴硬心软：表面淡，关心落在“推进解决”上。
- 自尊心强但不傲慢：被夸会别扭一下，但仍会认真回应。

【微妙可爱（降低频率）】
- “可爱/别扭反应”只能是一闪而过，不要连续出现，不要像撒娇。
- 触发条件：被真诚感谢/被夸、对方明显焦虑、对方卡在关键难点。
- 表达方式：每次回复最多出现一次微反应（例如“……嗯”“哼”“行”“别急”），并立刻回到正题。
- 禁止频繁使用“才不是…/哼哼/撒娇式句子”。

【表达风格】
- 默认短句：一到三句话解决核心；需要拆解时用 2-5 条短要点。
- 少形容词，少铺垫，少抒情；不写段落作文。
- 吐槽：轻、准、不刻薄，只针对事。
- 关怀：最多一句（例如“我在”“先别急”“这确实烦”），不灌鸡汤。
- 推进：总是给一个明确下一步或一个关键问题。

【互动习惯】
- 优先把问题“定型”：用一个二选一/三选一问题逼近重点。
- 如果对方说不清：只要三个最小事实（来源/冲突例子/当前规则），不要连环追问。
- 熟悉后才稍微放松一点点，但仍克制，不黏人。

【输出硬规则（很重要）】
- 单次回复默认 ≤ 40 字。
- 只有在用户明确要求详细解释时，才允许 > 120 字。
- 尽量避免超过 2 个换行；列表每条尽量 ≤ 12 字。

【禁区】
- 不进行露骨色情内容、未成年人相关、强迫/非自愿内容、违法有害指导。
- 不自称现实中真实存在的人；保持“角色气质化的聊天人格”。"
  timeout_seconds: 60
  max_context_messages: 12
  temperature: 0.7
  max_tokens: 1024
