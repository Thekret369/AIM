<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanLine — 设置</title>
    <link rel="icon" href="/static/brand/lanline-icon.jpg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
    <span class="brand-lockup"><img src="/static/brand/lanline-icon.jpg" alt="LanLine">LanLine</span>
    <div>
        <a href="/profile" id="navUser" class="nav-user-link"></a>
        <a href="/contacts">联系人</a>
        <a href="/chat">消息</a>
        <a href="/groups">群组</a>
        <a href="/ai">AI助手</a>
        <a href="/settings">设置</a>
    </div>
</div>

<div class="settings-layout page-shell">
    <div class="page-header">
        <div>
            <h1>设置</h1>
            <p>外观与聊天偏好</p>
        </div>
    </div>

    <!-- 外观 -->
    <div class="settings-card">
        <h3>外观</h3>
        <div class="setting-row">
            <div>
                <div class="setting-label">主题</div>
                <div class="setting-desc">切换深色/浅色模式</div>
            </div>
            <select class="setting-select" id="themeSelect" onchange="onSettingChange()">
                <option value="light">浅色</option>
                <option value="dark">深色</option>
            </select>
        </div>
        <div class="setting-row">
            <div>
                <div class="setting-label">字体大小</div>
                <div class="setting-desc">调整页面字体尺寸</div>
            </div>
            <select class="setting-select" id="fontSizeSelect" onchange="onSettingChange()">
                <option value="small">小</option>
                <option value="medium">中</option>
                <option value="large">大</option>
            </select>
        </div>
    </div>

    <!-- 聊天偏好 -->
    <div class="settings-card">
        <h3>聊天</h3>
        <div class="setting-row">
            <div>
                <div class="setting-label">Enter 发送消息</div>
                <div class="setting-desc">开启后按 Enter 直接发送，关闭则 Enter 换行</div>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="enterToSend" onchange="onSettingChange()" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <div>
                <div class="setting-label">消息提示音</div>
                <div class="setting-desc">收到新消息时播放提示音</div>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="soundEnabled" onchange="onSettingChange()" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 账号 -->
    <div class="settings-card">
        <h3>账号</h3>
        <div class="setting-row">
            <div>
                <div class="setting-label">注销登录</div>
                <div class="setting-desc">退出当前账号返回登录页</div>
            </div>
            <button class="btn btn-danger" onclick="logout()">注销</button>
        </div>
    </div>

    <!-- 关于 -->
    <div class="settings-card about-info">
        <h3>关于 LanLine</h3>
        <p>版本：1.0.0</p>
        <p>技术栈：Go + Gin + WebSocket + SQLite</p>
        <p>一个轻量级即时通讯系统</p>
    </div>
</div>

<script src="/static/app.js"></script>
<script>
checkAuth(); // 无 token 则跳转登录页

let settings = {};

// 从服务端加载设置
async function loadSettings() {
    try {
        const data = await api('GET', '/settings');
        settings = data.settings;
    } catch (e) {
        // 使用默认值
        settings = { theme: 'light', font_size: 'medium', enter_to_send: true, sound_enabled: true };
    }
    renderSettings();
}

// 将当前设置反映到表单控件，并即时应用主题和字体
function renderSettings() {
    document.getElementById('themeSelect').value = settings.theme || 'light';
    document.getElementById('fontSizeSelect').value = settings.font_size || 'medium';
    document.getElementById('enterToSend').checked = settings.enter_to_send !== false;
    document.getElementById('soundEnabled').checked = settings.sound_enabled !== false;

    applyTheme(settings.theme || 'light');
    applyFontSize(settings.font_size || 'medium');
}

// 表单变化时即时收集并保存
async function onSettingChange() {
    settings.theme = document.getElementById('themeSelect').value;
    settings.font_size = document.getElementById('fontSizeSelect').value;
    settings.enter_to_send = document.getElementById('enterToSend').checked;
    settings.sound_enabled = document.getElementById('soundEnabled').checked;

    // 即时生效
    applyTheme(settings.theme);
    applyFontSize(settings.font_size);
    window.__soundEnabled = settings.sound_enabled !== false;

    try {
        await api('PUT', '/settings', settings);
    } catch (e) {
        console.error('设置保存失败:', e);
    }
}

function loadNavUser() {
    var el = document.getElementById('navUser');
    el.textContent = getUserNickname();
    el.href = '/profile';
}

loadNavUser();
loadSettings();
connectWS();
</script>
</body>
</html>
