<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM - AI助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
    <span>AIM</span>
    <div>
        <a href="/profile" id="navUser" class="nav-user-link"></a>
        <a href="/contacts">联系人</a>
        <a href="/chat">消息</a>
        <a href="/groups">群组</a>
        <a href="/ai">AI助手</a>
        <a href="/settings">设置</a>
    </div>
</div>

<div class="settings-layout ai-layout page-shell">
    <div class="page-header ai-page-head">
        <div>
            <h1>AI助手</h1>
            <p>蓝妹配置、知识库与 token 用量</p>
        </div>
        <div class="page-actions">
            <button class="btn" onclick="openKnowledgeBaseModal()">新建知识库</button>
            <button class="btn btn-primary" onclick="openCreateModal('system')">创建蓝妹分身</button>
            <button class="btn" onclick="openCreateModal('third_party')">创建自定义Bot</button>
        </div>
    </div>
    <div id="aiNotice" class="ai-notice hidden"></div>

    <div class="ai-dashboard-grid">
        <section class="ai-main-section">
            <h2>蓝妹实例</h2>
            <div id="aiBotList" class="contact-list ai-bot-list">加载中...</div>
        </section>
        <aside class="ai-side-section">
            <div class="ai-panel">
                <div class="ai-panel-head">
                    <h2>知识库</h2>
                    <button class="btn btn-sm" onclick="openKnowledgeBaseModal()">新增</button>
                </div>
                <div id="knowledgeBaseList" class="ai-kb-list">加载中...</div>
            </div>
            <div class="ai-panel">
                <div class="ai-panel-head">
                    <h2>最近用量</h2>
                    <button class="btn btn-sm" onclick="loadTokenUsages()">刷新</button>
                </div>
                <div id="tokenUsageList" class="ai-usage-list">加载中...</div>
            </div>
        </aside>
    </div>
</div>

<div id="botModal" class="modal">
    <div class="modal-content ai-modal-content">
        <h3 id="botModalTitle">创建蓝妹分身</h3>
        <div class="ai-form-grid">
            <div class="form-group">
                <label for="botName">名称</label>
                <input type="text" id="botName" placeholder="我的蓝妹">
            </div>
            <div class="form-group">
                <label for="botAvatar">头像</label>
                <input type="text" id="botAvatar" placeholder="头像地址或短文本">
            </div>
            <div class="form-group" id="botAPISourceGroup">
                <label for="botAPISource">API来源</label>
                <select id="botAPISource" onchange="syncAPISourceFields()">
                    <option value="system">系统内置 API</option>
                    <option value="third_party">第三方 API</option>
                </select>
            </div>
            <div class="form-group">
                <label for="botModel">模型</label>
                <input type="text" id="botModel" placeholder="留空使用系统默认模型">
            </div>
            <div class="form-group provider-field">
                <label for="botBaseURL">API地址</label>
                <input type="text" id="botBaseURL" placeholder="https://api.openai.com/v1">
            </div>
            <div class="form-group provider-field">
                <label for="botAPIKey">API Key</label>
                <input type="password" id="botAPIKey" autocomplete="new-password">
            </div>
            <div class="form-group hidden" id="botStatusGroup">
                <label for="botStatus">状态</label>
                <select id="botStatus">
                    <option value="enabled">启用</option>
                    <option value="disabled">停用</option>
                </select>
            </div>
            <div class="form-group">
                <label for="botContextLimit">上下文条数</label>
                <input type="number" id="botContextLimit" min="1" step="1" value="12">
            </div>
            <div class="form-group">
                <label for="botTemperature">Temperature</label>
                <input type="number" id="botTemperature" min="0" max="2" step="0.1" value="0.7">
            </div>
            <div class="form-group">
                <label for="botMaxTokens">Max Tokens</label>
                <input type="number" id="botMaxTokens" min="1" step="1" value="1024">
            </div>
        </div>
        <div class="form-group">
            <label for="botSystemPrompt">系统提示词</label>
            <textarea id="botSystemPrompt" rows="5"></textarea>
        </div>
        <div class="form-group">
            <label>绑定知识库</label>
            <div id="botKnowledgeChoices" class="ai-kb-choice-list"></div>
        </div>
        <div class="error" id="botFormError"></div>
        <div class="ai-modal-actions">
            <button class="btn btn-primary" onclick="saveBot()">保存</button>
            <button class="btn" onclick="closeBotModal()">取消</button>
        </div>
    </div>
</div>

<div id="knowledgeBaseModal" class="modal">
    <div class="modal-content ai-modal-content ai-compact-modal">
        <h3>新建知识库</h3>
        <div class="form-group">
            <label for="kbName">名称</label>
            <input type="text" id="kbName" placeholder="业务资料">
        </div>
        <div class="form-group">
            <label for="kbDescription">描述</label>
            <textarea id="kbDescription" rows="3"></textarea>
        </div>
        <div class="error" id="kbFormError"></div>
        <div class="ai-modal-actions">
            <button class="btn btn-primary" onclick="saveKnowledgeBase()">保存</button>
            <button class="btn" onclick="closeKnowledgeBaseModal()">取消</button>
        </div>
    </div>
</div>

<div id="knowledgeDocumentModal" class="modal">
    <div class="modal-content ai-modal-content ai-compact-modal">
        <h3 id="docModalTitle">新增知识文档</h3>
        <div class="form-group">
            <label for="docTitle">标题</label>
            <input type="text" id="docTitle" placeholder="资料标题">
        </div>
        <div class="form-group">
            <label for="docContent">内容</label>
            <textarea id="docContent" rows="8"></textarea>
        </div>
        <div class="error" id="docFormError"></div>
        <div class="ai-modal-actions">
            <button class="btn btn-primary" onclick="saveKnowledgeDocument()">保存</button>
            <button class="btn" onclick="closeKnowledgeDocumentModal()">取消</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
<script>
checkAuth();

let bots = [];
let knowledgeBases = [];
let tokenUsages = [];
let editingBot = null;
let currentDocBaseID = 0;

function loadNavUser() {
    var el = document.getElementById('navUser');
    el.textContent = getUserNickname();
    el.href = '/profile';
}

async function loadAll() {
    await loadKnowledgeBases();
    await Promise.all([loadBots(), loadTokenUsages()]);
}

async function loadBots() {
    var list = document.getElementById('aiBotList');
    var notice = document.getElementById('aiNotice');
    notice.classList.add('hidden');
    list.innerHTML = '<div class="empty-state">加载中...</div>';

    try {
        const data = await api('GET', '/ai/bots');
        bots = data.bots || [];
        renderBots();
    } catch (e) {
        bots = [];
        list.innerHTML = '<div class="empty-state">暂无AI助手</div>';
        notice.textContent = e.message;
        notice.classList.remove('hidden');
    }
}

function renderBots() {
    var list = document.getElementById('aiBotList');
    if (bots.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无AI助手</div>';
        return;
    }
    list.innerHTML = bots.map(function(bot) {
        var name = bot.nickname || bot.username || ('AI用户' + bot.user_id);
        var statusClass = bot.ready ? 'enabled' : 'disabled';
        var statusText = bot.status === 'enabled' ? '启用' : '停用';
        var sourceText = apiSourceText(bot);
        var costText = usageText(bot);
        var kbText = bot.is_system ? '后台知识库' : ('知识库 ' + (bot.knowledge_base_count || 0));
        var availabilityText = bot.ready ? '可对话' : (bot.unavailable_reason || statusText);
        var chatClass = bot.ready ? 'btn btn-sm' : 'btn btn-sm btn-disabled';
        var chatTitle = bot.ready ? '' : ' title="' + escapeHtml(availabilityText) + '"';
        var editLabel = bot.ready ? '编辑' : '配置';
        var editBtn = bot.can_edit ? '<button class="btn btn-primary btn-sm" onclick="openEditModal(' + bot.id + ')">' + editLabel + '</button>' : '';
        var deleteBtn = bot.can_edit ? '<button class="btn btn-danger btn-sm" onclick="deleteBot(' + bot.id + ')">删除</button>' : '';
        return '<div class="contact-item ai-bot-item">' +
            '<div class="avatar">' + escapeHtml(bot.is_system ? 'AI' : name.charAt(0)) + '</div>' +
            '<div class="info">' +
                '<div class="name">' + escapeHtml(name) + '</div>' +
                '<div class="remark">' + escapeHtml(configSummary(bot, sourceText)) + '</div>' +
                '<div class="remark">' + escapeHtml(costText) + '</div>' +
                '<div class="ai-pill-row">' +
                    '<span class="ai-pill">' + escapeHtml(botTypeText(bot)) + '</span>' +
                    '<span class="ai-pill">' + escapeHtml(kbText) + '</span>' +
                    '<span class="ai-pill ' + statusClass + '">' + escapeHtml(availabilityText) + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="ai-bot-actions">' +
                '<button class="' + chatClass + '" onclick="chatWithBot(' + bot.user_id + ')"' + chatTitle + '>聊天</button>' +
                editBtn + deleteBtn +
            '</div>' +
        '</div>';
    }).join('');
}

function botTypeText(bot) {
    if (bot.is_system) return '内置助手';
    if (bot.api_source === 'system') return '系统 API 分身';
    return '第三方分身';
}

function apiSourceText(bot) {
    if (bot.api_source === 'system') return bot.is_system ? '系统 API' : '系统 API 计费';
    return '第三方 API';
}

function configSummary(bot, sourceText) {
    var model = bot.model || (bot.api_source === 'system' ? '系统默认模型' : '未配置模型');
    var keyText = bot.api_source === 'third_party'
        ? (bot.api_key_set ? 'Key 已保存' : 'Key 未保存')
        : '使用系统凭据';
    return '模型: ' + model + ' | ' + sourceText + ' | ' + keyText;
}

function usageText(bot) {
    var usage = bot.usage || {};
    var tokens = usage.total_tokens || 0;
    if (bot.api_source === 'system' && !bot.is_system) {
        return 'Token: ' + tokens + ' | 费用: ¥' + formatMoney(usage.total_cost_cny || 0);
    }
    return 'Token: ' + tokens + ' | 不计费';
}

function openCreateModal(apiSource) {
    editingBot = null;
    var source = apiSource || 'system';
    var title = source === 'system' ? '创建蓝妹分身' : '创建自定义Bot';
    document.getElementById('botModalTitle').textContent = title;
    document.getElementById('botStatusGroup').classList.add('hidden');
    // 创建时隐藏 API 来源选择，由入口按钮决定
    document.getElementById('botAPISourceGroup').classList.add('hidden');
    setFormValue({
        nickname: '',
        avatar: '',
        api_source: source,
        base_url: '',
        model: '',
        system_prompt: '',
        context_limit: 12,
        temperature: 0.7,
        max_tokens: 1024,
        status: 'enabled',
        knowledge_base_ids: []
    });
    document.getElementById('botAPIKey').placeholder = '';
    document.getElementById('botFormError').textContent = '';
    document.getElementById('botModal').classList.add('show');
}

function openEditModal(id) {
    var bot = bots.find(function(item) { return item.id === id; });
    if (!bot || !bot.can_edit) return;
    editingBot = bot;
    document.getElementById('botModalTitle').textContent = '编辑蓝妹分身';
    document.getElementById('botStatusGroup').classList.remove('hidden');
    document.getElementById('botAPISourceGroup').classList.remove('hidden');
    setFormValue(bot);
    document.getElementById('botAPIKey').placeholder = bot.api_key_set ? '留空则不更新' : '';
    document.getElementById('botFormError').textContent = '';
    document.getElementById('botModal').classList.add('show');
}

function closeBotModal() {
    document.getElementById('botModal').classList.remove('show');
}

function setFormValue(bot) {
    document.getElementById('botName').value = bot.nickname || '';
    document.getElementById('botAvatar').value = bot.avatar || '';
    document.getElementById('botAPISource').value = bot.api_source || 'system';
    document.getElementById('botBaseURL').value = bot.base_url || '';
    document.getElementById('botModel').value = bot.model || '';
    document.getElementById('botAPIKey').value = '';
    document.getElementById('botSystemPrompt').value = bot.system_prompt || '';
    document.getElementById('botContextLimit').value = bot.context_limit || 12;
    document.getElementById('botTemperature').value = (bot.temperature !== undefined && bot.temperature !== null) ? bot.temperature : 0.7;
    document.getElementById('botMaxTokens').value = bot.max_tokens || 1024;
    document.getElementById('botStatus').value = bot.status || 'enabled';
    renderKnowledgeChoices(bot.knowledge_base_ids || []);
    syncAPISourceFields();
}

function syncAPISourceFields() {
    var source = document.getElementById('botAPISource').value;
    var providerFields = document.querySelectorAll('.provider-field');
    providerFields.forEach(function(el) {
        el.classList.toggle('hidden', source === 'system');
    });
    document.getElementById('botModel').placeholder = source === 'system' ? '留空使用系统默认模型' : 'gpt-4o-mini';
}

function renderKnowledgeChoices(selected) {
    var box = document.getElementById('botKnowledgeChoices');
    if (knowledgeBases.length === 0) {
        box.innerHTML = '<div class="empty-state compact">暂无可绑定知识库</div>';
        return;
    }
    var selectedMap = {};
    selected.forEach(function(id) { selectedMap[id] = true; });
    box.innerHTML = knowledgeBases.map(function(kb) {
        return '<label class="ai-kb-choice">' +
            '<input type="checkbox" value="' + kb.id + '"' + (selectedMap[kb.id] ? ' checked' : '') + '> ' +
            '<span>' + escapeHtml(kb.name) + '</span>' +
        '</label>';
    }).join('');
}

function collectFormValue() {
    var temperature = parseFloat(document.getElementById('botTemperature').value);
    if (Number.isNaN(temperature)) temperature = 0.7;

    var ids = Array.prototype.slice.call(document.querySelectorAll('#botKnowledgeChoices input:checked'))
        .map(function(input) { return parseInt(input.value, 10); })
        .filter(function(id) { return id > 0; });
    var body = {
        name: document.getElementById('botName').value.trim(),
        avatar: document.getElementById('botAvatar').value.trim(),
        api_source: document.getElementById('botAPISource').value,
        base_url: document.getElementById('botBaseURL').value.trim(),
        model: document.getElementById('botModel').value.trim(),
        system_prompt: document.getElementById('botSystemPrompt').value.trim(),
        context_limit: parseInt(document.getElementById('botContextLimit').value, 10) || 12,
        temperature: temperature,
        max_tokens: parseInt(document.getElementById('botMaxTokens').value, 10) || 1024,
        knowledge_base_ids: ids
    };
    var apiKey = document.getElementById('botAPIKey').value.trim();
    if (apiKey) body.api_key = apiKey;
    if (editingBot) body.status = document.getElementById('botStatus').value;
    return body;
}

async function saveBot() {
    var err = document.getElementById('botFormError');
    err.textContent = '';
    var body = collectFormValue();
    if (!body.name) {
        err.textContent = '名称不能为空';
        return;
    }
    if (body.api_source === 'third_party' && (!body.base_url || !body.model)) {
        err.textContent = '第三方 API 需要填写 API 地址和模型';
        return;
    }

    try {
        if (editingBot) {
            await api('PUT', '/ai/bots/' + editingBot.id, body);
        } else {
            await api('POST', '/ai/bots', body);
        }
        closeBotModal();
        await loadBots();
        await loadTokenUsages();
    } catch (e) {
        err.textContent = e.message;
    }
}

async function deleteBot(id) {
    if (!confirm('确认删除该蓝妹分身？')) return;
    try {
        await api('DELETE', '/ai/bots/' + id);
        await loadBots();
    } catch (e) {
        alert(e.message);
    }
}

async function loadKnowledgeBases() {
    var list = document.getElementById('knowledgeBaseList');
    list.innerHTML = '<div class="empty-state compact">加载中...</div>';
    try {
        var data = await api('GET', '/ai/knowledge-bases');
        knowledgeBases = data.knowledge_bases || [];
        renderKnowledgeBases();
    } catch (e) {
        knowledgeBases = [];
        list.innerHTML = '<div class="empty-state compact">' + escapeHtml(e.message) + '</div>';
    }
}

function renderKnowledgeBases() {
    var list = document.getElementById('knowledgeBaseList');
    if (knowledgeBases.length === 0) {
        list.innerHTML = '<div class="empty-state compact">暂无知识库</div>';
        return;
    }
    list.innerHTML = knowledgeBases.map(function(kb) {
        var docs = kb.documents || [];
        var docHtml = docs.slice(0, 3).map(function(doc) {
            return '<div class="ai-kb-doc">' +
                '<span>' + escapeHtml(doc.title) + '</span>' +
                '<button class="btn btn-sm btn-danger" onclick="deleteKnowledgeDocument(' + doc.id + ')">删除</button>' +
            '</div>';
        }).join('');
        return '<div class="ai-kb-item">' +
            '<div class="ai-kb-title">' + escapeHtml(kb.name) + '</div>' +
            '<div class="remark">' + escapeHtml(kb.description || '无描述') + '</div>' +
            '<div class="remark">文档 ' + (kb.document_count || 0) + '</div>' +
            '<div class="ai-kb-doc-list">' + docHtml + '</div>' +
            '<div class="ai-kb-actions">' +
                '<button class="btn btn-sm" onclick="openKnowledgeDocumentModal(' + kb.id + ')">新增文档</button>' +
                '<button class="btn btn-sm btn-danger" onclick="deleteKnowledgeBase(' + kb.id + ')">删除</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

function openKnowledgeBaseModal() {
    document.getElementById('kbName').value = '';
    document.getElementById('kbDescription').value = '';
    document.getElementById('kbFormError').textContent = '';
    document.getElementById('knowledgeBaseModal').classList.add('show');
}

function closeKnowledgeBaseModal() {
    document.getElementById('knowledgeBaseModal').classList.remove('show');
}

async function saveKnowledgeBase() {
    var err = document.getElementById('kbFormError');
    err.textContent = '';
    var body = {
        name: document.getElementById('kbName').value.trim(),
        description: document.getElementById('kbDescription').value.trim()
    };
    if (!body.name) {
        err.textContent = '知识库名称不能为空';
        return;
    }
    try {
        await api('POST', '/ai/knowledge-bases', body);
        closeKnowledgeBaseModal();
        await loadKnowledgeBases();
        renderKnowledgeChoices(editingBot ? (editingBot.knowledge_base_ids || []) : []);
    } catch (e) {
        err.textContent = e.message;
    }
}

async function deleteKnowledgeBase(id) {
    if (!confirm('确认删除该知识库？')) return;
    try {
        await api('DELETE', '/ai/knowledge-bases/' + id);
        await loadKnowledgeBases();
        await loadBots();
    } catch (e) {
        alert(e.message);
    }
}

function openKnowledgeDocumentModal(baseID) {
    currentDocBaseID = baseID;
    document.getElementById('docTitle').value = '';
    document.getElementById('docContent').value = '';
    document.getElementById('docFormError').textContent = '';
    document.getElementById('knowledgeDocumentModal').classList.add('show');
}

function closeKnowledgeDocumentModal() {
    document.getElementById('knowledgeDocumentModal').classList.remove('show');
}

async function saveKnowledgeDocument() {
    var err = document.getElementById('docFormError');
    err.textContent = '';
    var body = {
        title: document.getElementById('docTitle').value.trim(),
        content: document.getElementById('docContent').value.trim()
    };
    if (!body.title || !body.content) {
        err.textContent = '标题和内容不能为空';
        return;
    }
    try {
        await api('POST', '/ai/knowledge-bases/' + currentDocBaseID + '/documents', body);
        closeKnowledgeDocumentModal();
        await loadKnowledgeBases();
    } catch (e) {
        err.textContent = e.message;
    }
}

async function deleteKnowledgeDocument(id) {
    if (!confirm('确认删除该文档？')) return;
    try {
        await api('DELETE', '/ai/knowledge-documents/' + id);
        await loadKnowledgeBases();
    } catch (e) {
        alert(e.message);
    }
}

async function loadTokenUsages() {
    var list = document.getElementById('tokenUsageList');
    list.innerHTML = '<div class="empty-state compact">加载中...</div>';
    try {
        var data = await api('GET', '/ai/token-usages?page_size=8');
        tokenUsages = data.usages || [];
        renderTokenUsages();
    } catch (e) {
        tokenUsages = [];
        list.innerHTML = '<div class="empty-state compact">' + escapeHtml(e.message) + '</div>';
    }
}

function renderTokenUsages() {
    var list = document.getElementById('tokenUsageList');
    if (tokenUsages.length === 0) {
        list.innerHTML = '<div class="empty-state compact">暂无用量</div>';
        return;
    }
    list.innerHTML = '<table class="ai-usage-table"><thead><tr>' +
        '<th>来源</th><th>Token</th><th>费用</th>' +
        '</tr></thead><tbody>' +
        tokenUsages.map(function(row) {
            return '<tr>' +
                '<td>' + escapeHtml(row.api_source === 'system' ? '系统' : '第三方') + '</td>' +
                '<td>' + (row.total_tokens || 0) + '</td>' +
                '<td>' + (row.billable ? ('¥' + formatMoney(row.total_cost_cny || 0)) : '-') + '</td>' +
            '</tr>';
        }).join('') +
        '</tbody></table>';
}

function chatWithBot(userID) {
    var bot = bots.find(function(item) { return item.user_id === userID; });
    if (bot && !bot.ready) {
        var notice = document.getElementById('aiNotice');
        notice.textContent = (bot.nickname || bot.username || 'AI助手') + '暂不可用：' + (bot.unavailable_reason || '配置不完整');
        notice.classList.remove('hidden');
        return;
    }
    window.location.href = '/chat?peer=' + userID;
}

function formatMoney(value) {
    return Number(value || 0).toFixed(6).replace(/0+$/, '').replace(/\.$/, '.00');
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

loadNavUser();
loadAndApplySettings();
loadAll();
</script>
</body>
</html>
