<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM — 个人信息</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
    <span>AIM</span>
    <div>
        <a href="/profile" id="navUser" class="nav-user-link"></a>
        <a href="/contacts">联系人</a>
        <a href="/chat">聊天</a>
        <a href="/groups">群组</a>
        <a href="/settings">设置</a>
    </div>
</div>
<div class="container">
    <div class="section">
        <h2>个人资料</h2>
        <div id="profileInfo">加载中...</div>
    </div>
    <div class="section">
        <h2>修改资料</h2>
        <div class="form-group">
            <label>昵称</label>
            <input type="text" id="editNickname" placeholder="输入新昵称">
        </div>
        <div class="form-group">
            <label>头像 URL</label>
            <input type="text" id="editAvatar" placeholder="输入头像图片链接">
        </div>
        <button class="btn btn-primary" onclick="saveProfile()">保存修改</button>
        <span class="msg" id="profileMsg"></span>
    </div>
</div>
<script src="/static/app.js"></script>
<script>
async function loadProfile() {
    try {
        const data = await api('GET', '/profile');
        const u = data.user;
        document.getElementById('profileInfo').innerHTML =
            '<div class="profile-card">' +
            '<p><strong>用户名：</strong>' + escapeHtml(u.username) + '</p>' +
            '<p><strong>昵称：</strong>' + escapeHtml(u.nickname || '未设置') + '</p>' +
            '<p><strong>头像：</strong>' + (u.avatar ? '<img src="' + escapeHtml(u.avatar) + '" class="avatar-preview" onerror="this.style.display=\'none\'">' : '未设置') + '</p>' +
            '<p><strong>注册时间：</strong>' + u.created_at + '</p>' +
            '<p><strong>用户类型：</strong>' + (u.is_ai ? 'AI 助手' : '普通用户') + '</p>' +
            '</div>';
        document.getElementById('editNickname').value = u.nickname || '';
        document.getElementById('editAvatar').value = u.avatar || '';
    } catch(e) {
        document.getElementById('profileInfo').textContent = e.message;
    }
}

async function saveProfile() {
    const nickname = document.getElementById('editNickname').value.trim();
    const avatar = document.getElementById('editAvatar').value.trim();
    const msg = document.getElementById('profileMsg');
    try {
        const data = await api('PUT', '/profile', { nickname, avatar });
        setUserNickname(data.user.nickname || data.user.username);
        msg.textContent = '保存成功';
        msg.className = 'msg success';
        loadProfile();
        loadNavUser();
    } catch(e) {
        msg.textContent = e.message;
        msg.className = 'msg error';
    }
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function loadNavUser() {
    var el = document.getElementById('navUser');
    el.textContent = getUserNickname();
    el.href = '/profile';
}

loadAndApplySettings();
loadNavUser();
loadProfile();
</script>
</body>
</html>
