<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM — 消息</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
    <span>AIM</span>
    <div>
        <a href="/profile" id="navUser" class="nav-user-link"></a>
        <a href="/contacts">联系人</a>
        <a href="/chat">消息</a>
        <a href="/groups">群组</a>
        <a href="/ai">AI助手</a>
        <a href="/settings">设置</a>
    </div>
</div>

<div class="chat-layout">
    <!-- 左侧边栏：统一会话列表 -->
    <div class="chat-sidebar">
        <div class="chat-sidebar-head">
            <div>
                <h2>消息</h2>
                <p>会话列表</p>
            </div>
            <a class="btn btn-sm" href="/contacts">联系人</a>
        </div>
        <div class="global-search-box">
            <input id="globalSearchInput" type="search" placeholder="全局查找消息">
            <div class="global-search-times">
                <input id="globalSearchStart" type="datetime-local" title="开始时间">
                <input id="globalSearchEnd" type="datetime-local" title="结束时间">
            </div>
            <div class="global-search-actions">
                <label><input id="globalSearchGrouped" type="checkbox" checked> 按会话</label>
                <button type="button" onclick="globalSearchMessages()">查找</button>
                <button type="button" onclick="clearGlobalSearch()">清除</button>
            </div>
            <div class="global-search-results hidden" id="globalSearchResults"></div>
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="chat-main" id="chatMain">
        <div class="tab-bar" id="tabBar"></div>
        <div class="chat-content-shell">
            <div class="tab-panels" id="tabPanels">
                <div class="no-chat-placeholder" id="noChatPlaceholder">选择好友或群组开始聊天</div>
            </div>
            <!-- 群详情右侧抽屉 -->
            <div class="group-panel hidden" id="groupPanel">
                <div class="group-panel-head">
                    <span id="gpTitle">群详情</span>
                    <span class="group-panel-tools">
                        <button class="btn btn-sm group-panel-dnd" id="gpDndBtn" onclick="toggleGroupDND()" title="免打扰">🔔</button>
                        <button class="group-panel-close" type="button" onclick="closeGroupPanel()" aria-label="关闭群详情">&times;</button>
                    </span>
                </div>
                <div class="group-panel-tabs">
                    <button class="gp-tab-btn active" data-gp-tab="info" onclick="switchGroupPanelTab('info')">群资料</button>
                    <button class="gp-tab-btn" data-gp-tab="announce" onclick="switchGroupPanelTab('announce')">群公告</button>
                    <button class="gp-tab-btn" data-gp-tab="members" onclick="switchGroupPanelTab('members')">成员</button>
                </div>
                <div class="group-panel-body" id="groupPanelBody"></div>
            </div>
        </div>
    </div>
</div>

<!-- @ 提及成员选择弹层 -->
<div class="mention-dropdown hidden" id="mentionDropdown"></div>

<!-- 附件弹出菜单 -->
<div class="attach-menu hidden" id="attachMenu">
    <div class="attach-item" onclick="pickImage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>图片</span>
    </div>
    <div class="attach-item" onclick="pickFile()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>文件</span>
    </div>
    <div class="attach-item" id="attachRecordItem" onclick="handleRecordToggle()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        <span>录音</span>
    </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/msgstore.js"></script>
<script src="/static/chat-ext.js"></script>
<script>
checkAuth();

var navUserEl = document.getElementById('navUser');
navUserEl.textContent = getUserNickname();
navUserEl.href = '/profile';

// ========================================
// 核心状态
// ========================================
let sidebarFriends = [];
let sidebarGroups = [];
let sidebarAIBots = [];
let conversations = [];
let lastTimestamps = new Map();
let chatTabs = new Map();
let activeTabKey = null;
let unreadCounts = new Map();
let lastMessages = new Map();
let chatInitialized = false;
let pendingOnlineSync = false;
let onlineSyncRunning = false;
let quotedMessageByTab = new Map();
let pendingSends = new Map();
const MESSAGE_RECALL_WINDOW_MS = 2 * 60 * 1000;

// 群相关缓存
let groupMembersMap = new Map();   // groupId → members[]
let groupDNDMap = new Map();        // groupId → bool

// 群详情面板状态
let currentGroupPanelKey = null;
let groupPanelData = null;
let groupPanelActiveTab = 'info';

// @ 提及状态
let mentionActiveInput = null;
let mentionActiveKey = null;

// ========================================
// 数据加载
// ========================================
async function loadFriends() {
    try {
        const data = await api('GET', '/friends');
        sidebarFriends = data.friends || [];
    } catch(e) { sidebarFriends = []; }
}

async function loadGroups() {
    try {
        const data = await api('GET', '/groups');
        sidebarGroups = data.groups || [];
    } catch(e) { sidebarGroups = []; }
}

async function loadAIBots() {
    try {
        const data = await api('GET', '/ai/bots');
        sidebarAIBots = data.bots || [];
    } catch(e) { sidebarAIBots = []; }
}

// 预加载所有群的 DND 状态和成员列表
async function loadGroupMetadata() {
    var promises = sidebarGroups.map(function(g) {
        return api('GET', '/groups/' + g.id).then(function(data) {
            groupDNDMap.set(g.id, data.dnd || false);
        }).catch(function() {});
    });
    await Promise.all(promises);
}

// ========================================
// 统一会话列表构建 & 排序
// ========================================
function buildConversations() {
    conversations = [];
    function pushConversation(conv) {
        if (conversations.find(function(c) { return c.key === conv.key; })) return;
        conversations.push(conv);
    }

    pushConversation({
        key: 'broadcast',
        type: 'broadcast',
        targetId: 0,
        name: '广播消息',
        avatarChar: '📢'
    });
    sidebarFriends.forEach(function(f) {
        var name = f.remark || f.nickname || f.username || ('用户' + f.friend_id);
        conversations.push({
            key: 'user:' + f.friend_id, type: 'user', targetId: f.friend_id,
            name: name, avatarChar: name.charAt(0)
        });
    });
    sidebarAIBots.forEach(function(bot) {
        if (bot.status === 'disabled') return;
        var name = getAIBotName(bot);
        pushConversation({
            key: 'user:' + bot.user_id, type: 'user', targetId: bot.user_id,
            name: name, avatarChar: 'AI'
        });
    });
    sidebarGroups.forEach(function(g) {
        pushConversation({
            key: 'group:' + g.id, type: 'group', targetId: g.id,
            name: g.name, avatarChar: g.name.charAt(0)
        });
    });
}

function sortConversations() {
    conversations.sort(function(a, b) {
        if (a.key === 'broadcast') return -1;
        if (b.key === 'broadcast') return 1;
        var ta = lastTimestamps.get(a.key);
        var tb = lastTimestamps.get(b.key);
        if (ta && !tb) return -1;
        if (!ta && tb) return 1;
        if (!ta && !tb) return 0;
        return tb - ta;
    });
}

function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var yesterday = new Date(today.getTime() - 86400000);
    var msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (msgDay.getTime() === today.getTime()) {
        var h = d.getHours(), m = d.getMinutes();
        return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    } else if (msgDay.getTime() === yesterday.getTime()) {
        return '昨天';
    } else if (msgDay.getTime() > today.getTime() - 604800000) {
        var days = ['日', '一', '二', '三', '四', '五', '六'];
        return '周' + days[d.getDay()];
    } else {
        return (d.getMonth() + 1) + '/' + d.getDate();
    }
}

async function loadLastMessages() {
    var fetches = conversations.map(function(c) {
        var url;
        if (c.type === 'user') url = '/history?peer_id=' + c.targetId + '&page=1&page_size=1';
        else if (c.type === 'group') url = '/history/group/' + c.targetId + '?page=1&page_size=1';
        else url = '/history/broadcast?page=1&page_size=1';
        return api('GET', url).then(function(data) {
            if (data.messages && data.messages.length > 0) {
                var msg = data.messages[0];
                lastMessages.set(c.key, msg);
                if (msg.created_at) lastTimestamps.set(c.key, new Date(msg.created_at));
            }
        }).catch(function() {});
    });
    await Promise.all(fetches);
}

// ========================================
// 侧边栏渲染
// ========================================
function renderSidebar() {
    var list = document.getElementById('sidebarList');
    var html = '';
    conversations.forEach(function(c) {
        var unread = unreadCounts.get(c.key) || 0;
        var preview = lastMessages.get(c.key);
        var ts = lastTimestamps.get(c.key);
        var dnd = false;
        if (c.type === 'group') dnd = groupDNDMap.get(c.targetId) || false;
        html += sidebarItemHTML(c.key, c.type, c.targetId, c.avatarChar, c.name, preview, unread, ts, dnd);
    });
    list.innerHTML = html || '<div class="empty-state sidebar-empty">暂无会话</div>';
    list.querySelectorAll('.sidebar-item').forEach(function(el) {
        el.addEventListener('click', function() {
            var key = this.dataset.key, type = this.dataset.type;
            var targetId = parseInt(this.dataset.target) || 0;
            var name = this.querySelector('.item-name').textContent;
            openOrSwitchTab(key, type, targetId, name);
        });
    });
}

function sidebarItemHTML(key, type, targetId, avatarChar, name, previewMsg, unread, timestamp, dnd) {
    var activeClass = (key === activeTabKey) ? ' active' : '';
    var badgeHTML = unread > 0 ? '<span class="badge">' + unread + '</span>' : '';
    var previewHTML = previewMsg ? getPreviewText(previewMsg).substring(0, 20) : '';
    var timeHTML = timestamp ? '<span class="item-time">' + formatTime(timestamp) + '</span>' : '';
    var dndIcon = dnd ? '<span class="item-dnd">🔕</span>' : '';
    return '<div class="sidebar-item' + activeClass + '" data-key="' + key + '" data-type="' + type + '" data-target="' + targetId + '">' +
        '<div class="avatar">' + escapeHtml(avatarChar) + '</div>' +
        '<div class="item-info">' +
            '<div class="item-name">' + dndIcon + escapeHtml(name) + '</div>' +
            (previewHTML ? '<div class="item-preview">' + escapeHtml(previewHTML) + '</div>' : '') +
        '</div>' + timeHTML + badgeHTML +
    '</div>';
}

function ensureConversationForMessage(key, msg) {
    if (conversations.find(function(c) { return c.key === key; })) return;

    if (key.startsWith('group:')) {
        var gid = parseInt(key.split(':')[1]);
        var group = sidebarGroups.find(function(g) { return g.id === gid; });
        var groupName = group ? group.name : ('群组' + gid);
        conversations.push({
            key: key,
            type: 'group',
            targetId: gid,
            name: groupName,
            avatarChar: groupName.charAt(0)
        });
        return;
    }

    if (key.startsWith('user:')) {
        var uid = parseInt(key.split(':')[1]);
        var friend = sidebarFriends.find(function(f) { return f.friend_id === uid; });
        var bot = findAIBotByUserID(uid);
        var userName = '';
        if (friend) {
            userName = friend.remark || friend.nickname || friend.username || ('用户' + uid);
        } else if (bot) {
            userName = getAIBotName(bot);
        } else if (msg.from_user && msg.from_user_id === uid) {
            userName = msg.from_user.nickname || msg.from_user.username || ('用户' + uid);
        } else {
            userName = '用户' + uid;
        }
        conversations.push({
            key: key,
            type: 'user',
            targetId: uid,
            name: userName,
            avatarChar: userName.charAt(0)
        });
    }
}

function findAIBotByUserID(userID) {
    return sidebarAIBots.find(function(bot) { return bot.user_id === userID; });
}

function getAIBotName(bot) {
    return bot.nickname || bot.username || ('AI用户' + bot.user_id);
}

function updateSidebarBadge(key) {
    var el = document.querySelector('.sidebar-item[data-key="' + key + '"]');
    if (!el) return;
    var badgeEl = el.querySelector('.badge');
    var count = unreadCounts.get(key) || 0;
    if (count > 0) {
        if (!badgeEl) { badgeEl = document.createElement('span'); badgeEl.className = 'badge'; el.appendChild(badgeEl); }
        badgeEl.textContent = count; badgeEl.style.display = 'inline-block';
    } else if (badgeEl) { badgeEl.style.display = 'none'; }
}

function getPreviewText(msg) {
    if (msg && msg.is_recalled) return '消息已撤回';
    if (msg && msg._streaming) return msg.content || '正在生成';
    switch (msg.type) {
        case 'image': return '[图片]';
        case 'file': return '[文件] ' + (msg.file_name || '');
        case 'audio': return '[语音]';
        default: return msg.content || '';
    }
}

function shouldUseAsConversationLatest(key, msg) {
    var current = lastMessages.get(key);
    if (!current || !current.id || !msg || !msg.id) return true;
    if (current.id === msg.id) return true;
    return msg.id > current.id;
}

function updateSidebarPreview(key, msg) {
    var el = document.querySelector('.sidebar-item[data-key="' + key + '"] .item-preview');
    if (!el) return;
    el.textContent = getPreviewText(msg).substring(0, 20);
}

function resortSidebarItem(key) {
    var el = document.querySelector('.sidebar-item[data-key="' + key + '"]');
    if (!el || key === 'broadcast') return;
    sortConversations();
    var idx = -1;
    for (var i = 0; i < conversations.length; i++) { if (conversations[i].key === key) { idx = i; break; } }
    if (idx === -1) return;
    var list = document.getElementById('sidebarList');
    var nextKey = (idx + 1 < conversations.length) ? conversations[idx + 1].key : null;
    var nextEl = nextKey ? list.querySelector('.sidebar-item[data-key="' + nextKey + '"]') : null;
    if (nextEl) list.insertBefore(el, nextEl); else list.appendChild(el);
}

// ========================================
// 标签管理
// ========================================
function openOrSwitchTab(key, type, targetId, name) {
    if (chatTabs.has(key)) { switchToTab(key); }
    else { createTab(key, type, targetId, name); switchToTab(key); loadHistory(key, 1); }
    unreadCounts.set(key, 0);
    updateSidebarBadge(key); updateTabBadge(key); renderSidebar();
}

function createTab(key, type, targetId, name) {
    var tabEl = document.createElement('span');
    tabEl.className = 'chat-tab';
    tabEl.innerHTML = '<span class="tab-name">' + escapeHtml(name) + '</span>' +
        '<span class="tab-badge" style="display:none"></span>' +
        '<span class="tab-close">&times;</span>';
    tabEl.querySelector('.tab-name').addEventListener('click', function(e) { e.stopPropagation(); switchToTab(key); });
    tabEl.querySelector('.tab-close').addEventListener('click', function(e) { e.stopPropagation(); closeTab(key); });
    document.getElementById('tabBar').appendChild(tabEl);

    var panelEl = document.createElement('div');
    panelEl.className = 'tab-panel hidden';
    if (type === 'group') {
        panelEl.innerHTML =
            '<div class="chat-header">' +
                '<span class="chat-title">' + escapeHtml(name) + '</span>' +
                '<div class="chat-header-actions">' +
                    '<input class="chat-search-input" type="search" placeholder="搜索消息">' +
                    '<input class="chat-search-start" type="datetime-local" title="开始时间">' +
                    '<input class="chat-search-end" type="datetime-local" title="结束时间">' +
                    '<button class="chat-search-btn" type="button">搜索</button>' +
                    '<button class="chat-search-clear hidden" type="button" title="清除搜索">&times;</button>' +
                    '<button class="btn btn-sm btn-primary group-detail-btn" type="button">群详情</button>' +
                '</div>' +
            '</div>' +
            '<div class="chat-search-results hidden"></div>' +
            '<div class="chat-messages"></div>' +
            '<div class="quote-compose hidden"></div>' +
            '<div class="chat-input">' +
                '<button class="attach-btn" title="添加附件">+</button>' +
                '<input type="text" placeholder="输入消息，@ 提及成员...">' +
                '<button class="send-btn">发送</button>' +
            '</div>';
    } else {
        panelEl.innerHTML =
            '<div class="chat-header">' +
                '<span class="chat-title">' + escapeHtml(name) + '</span>' +
                '<div class="chat-header-actions">' +
                    '<input class="chat-search-input" type="search" placeholder="搜索消息">' +
                    '<input class="chat-search-start" type="datetime-local" title="开始时间">' +
                    '<input class="chat-search-end" type="datetime-local" title="结束时间">' +
                    '<button class="chat-search-btn" type="button">搜索</button>' +
                    '<button class="chat-search-clear hidden" type="button" title="清除搜索">&times;</button>' +
                '</div>' +
            '</div>' +
            '<div class="chat-search-results hidden"></div>' +
            '<div class="chat-messages"></div>' +
            '<div class="quote-compose hidden"></div>' +
            '<div class="chat-input">' +
                '<button class="attach-btn" title="添加附件">+</button>' +
                '<input type="text" placeholder="输入消息...">' +
                '<button class="send-btn">发送</button>' +
            '</div>';
    }
    var inputEl = panelEl.querySelector('.chat-input input');
    var btnEl = panelEl.querySelector('.send-btn');
    var attachBtn = panelEl.querySelector('.attach-btn');
    var searchInputEl = panelEl.querySelector('.chat-search-input');
    var searchStartEl = panelEl.querySelector('.chat-search-start');
    var searchEndEl = panelEl.querySelector('.chat-search-end');
    var searchBtnEl = panelEl.querySelector('.chat-search-btn');
    var searchClearEl = panelEl.querySelector('.chat-search-clear');
    var searchResultsEl = panelEl.querySelector('.chat-search-results');
    var quoteComposeEl = panelEl.querySelector('.quote-compose');
    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage(key);
    });
    btnEl.addEventListener('click', function() { sendMessage(key); });
    attachBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleAttachMenu(key, this);
    });
    searchBtnEl.addEventListener('click', function() { searchMessagesInTab(key); });
    searchClearEl.addEventListener('click', function() { clearSearchResults(key); });
    searchInputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchMessagesInTab(key);
        } else if (e.key === 'Escape') {
            clearSearchResults(key);
        }
    });
    [searchStartEl, searchEndEl].forEach(function(el) {
        el.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchMessagesInTab(key);
            }
        });
    });

    // 群聊 @ 提及支持
    if (type === 'group') {
        inputEl.addEventListener('input', function(e) { onMentionInput(key, this); });
        inputEl.addEventListener('blur', function() { setTimeout(hideMentionDropdown, 200); });
        // 预加载成员列表
        if (!groupMembersMap.has(targetId)) {
            api('GET', '/groups/' + targetId + '/members').then(function(data) {
                groupMembersMap.set(targetId, data.members || []);
            }).catch(function() {});
        }
    }

    document.getElementById('tabPanels').appendChild(panelEl);

    var panelMessagesEl = panelEl.querySelector('.chat-messages');
    panelMessagesEl.addEventListener('scroll', function() {
        if (this.scrollTop < 40 && chatTabs.has(key)) {
            var tab = chatTabs.get(key);
            if (tab.hasMore && !tab._loading) { tab._loading = true; loadHistory(key, tab.historyPage); }
        }
    });
    panelMessagesEl.addEventListener('click', function(e) {
        var recallBtn = e.target.closest('.recall-message-btn');
        if (recallBtn) {
            e.preventDefault();
            recallMessage(key, parseInt(recallBtn.dataset.msgId || '0', 10), recallBtn);
            return;
        }
        var deleteBtn = e.target.closest('.delete-message-btn');
        if (deleteBtn) {
            e.preventDefault();
            deleteMessageForMe(key, parseInt(deleteBtn.dataset.msgId || '0', 10), deleteBtn);
            return;
        }
        var quoteBtn = e.target.closest('.quote-reply-btn');
        if (quoteBtn) {
            e.preventDefault();
            startQuoteReply(key, parseInt(quoteBtn.dataset.msgId || '0', 10));
            return;
        }
        var quoteRef = e.target.closest('.quote-ref');
        if (quoteRef) {
            e.preventDefault();
            focusMessageElement(key, parseInt(quoteRef.dataset.quoteId || '0', 10));
        }
    });

    var headerEl = panelEl.querySelector('.chat-header');

    chatTabs.set(key, {
        type: type, targetId: targetId, name: name,
        messages: [], historyPage: 1, hasMore: true, _loading: false,
        panelEl: panelEl, messagesEl: panelMessagesEl,
        inputEl: inputEl, headerEl: headerEl, tabEl: tabEl,
        searchInputEl: searchInputEl, searchStartEl: searchStartEl, searchEndEl: searchEndEl,
        searchResultsEl: searchResultsEl, searchClearEl: searchClearEl, quoteComposeEl: quoteComposeEl
    });
    augmentTab(key, chatTabs.get(key));

    if (type === 'group') {
        headerEl.querySelector('.group-detail-btn').addEventListener('click', function(e) {
            e.stopPropagation(); toggleGroupPanel(key);
        });
    }
}

function switchToTab(key) {
    if (activeTabKey && chatTabs.has(activeTabKey)) {
        var old = chatTabs.get(activeTabKey);
        old.panelEl.classList.add('hidden'); old.tabEl.classList.remove('active');
    }
    var tab = chatTabs.get(key);
    tab.panelEl.classList.remove('hidden'); tab.tabEl.classList.add('active');
    activeTabKey = key; tab.inputEl.focus();
    var placeholder = document.getElementById('noChatPlaceholder');
    if (placeholder) placeholder.style.display = 'none';
    document.querySelectorAll('.sidebar-item').forEach(function(el) {
        el.classList.toggle('active', el.dataset.key === key);
    });
    updateOnlineDots();
    sendReadReceiptForTab(key);
    var panel = document.getElementById('groupPanel');
    if (!panel.classList.contains('hidden')) {
        if (tab.type === 'group') { currentGroupPanelKey = key; loadGroupPanel(key); }
        else closeGroupPanel();
    }
}

function closeTab(key) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    var wasActive = (key === activeTabKey);
    var keys = Array.from(chatTabs.keys());
    var idx = keys.indexOf(key);
    var fallbackKey = keys[idx + 1] || keys[idx - 1] || null;
    if (currentGroupPanelKey === key) closeGroupPanel();
    quotedMessageByTab.delete(key);
    tab.panelEl.remove(); tab.tabEl.remove(); chatTabs.delete(key);
    if (wasActive) {
        activeTabKey = null;
        if (fallbackKey) switchToTab(fallbackKey);
        else { var ph = document.getElementById('noChatPlaceholder'); if (ph) ph.style.display = ''; }
    }
}

function updateTabBadge(key) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    var badgeEl = tab.tabEl.querySelector('.tab-badge');
    var count = unreadCounts.get(key) || 0;
    if (count > 0) { badgeEl.textContent = count; badgeEl.style.display = 'inline'; }
    else badgeEl.style.display = 'none';
}

// ========================================
// @ 提及下拉
// ========================================
function onMentionInput(key, inputEl) {
    var val = inputEl.value;
    var cursorPos = inputEl.selectionStart;
    // 找到光标前最近的 @
    var atIdx = val.lastIndexOf('@', cursorPos - 1);
    if (atIdx === -1 || (atIdx > 0 && val.charAt(atIdx - 1) !== ' ' && val.charAt(atIdx - 1) !== '')) {
        // @ 不在词首则隐藏（简单处理：@ 前面必须是空格或行首）
        if (atIdx > 0 && val.charAt(atIdx - 1) !== ' ') { hideMentionDropdown(); return; }
    }
    if (atIdx === -1) { hideMentionDropdown(); return; }

    var filter = val.substring(atIdx + 1, cursorPos).toLowerCase();
    var parts = key.split(':');
    var groupId = parseInt(parts[1]);
    var members = groupMembersMap.get(groupId) || [];
    if (members.length === 0) return;

    var myId = getUserId();
    var filtered = members.filter(function(m) {
        if (m.user_id === myId) return false; // 不 @ 自己
        var dn = (m.nickname || m.username || '').toLowerCase();
        return filter === '' || dn.indexOf(filter) !== -1;
    });

    if (filtered.length === 0) { hideMentionDropdown(); return; }

    mentionActiveInput = inputEl;
    mentionActiveKey = key;
    var dd = document.getElementById('mentionDropdown');
    dd.innerHTML = filtered.map(function(m) {
        var dn = m.nickname || m.username || ('用户' + m.user_id);
        return '<div class="mention-item" data-user-id="' + m.user_id + '" data-name="' + escapeHtml(dn) + '" onclick="insertMention(this)">' +
            '<span class="mention-avatar">' + escapeHtml(dn.charAt(0)) + '</span>' +
            '<span>' + escapeHtml(dn) + '</span>' +
        '</div>';
    }).join('');
    dd.classList.remove('hidden');
    // 定位到输入框上方
    var rect = inputEl.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.top - dd.offsetHeight - 4) + 'px';
    dd.style.minWidth = '180px';
}

function insertMention(el) {
    if (!mentionActiveInput) return;
    var name = el.dataset.name;
    var inputEl = mentionActiveInput;
    var val = inputEl.value;
    var cursorPos = inputEl.selectionStart;
    var atIdx = val.lastIndexOf('@', cursorPos - 1);
    if (atIdx === -1) return;
    var before = val.substring(0, atIdx);
    var after = val.substring(cursorPos);
    inputEl.value = before + '@' + name + ' ' + after;
    var newPos = before.length + name.length + 2;
    inputEl.setSelectionRange(newPos, newPos);
    inputEl.focus();
    hideMentionDropdown();
}

function hideMentionDropdown() {
    document.getElementById('mentionDropdown').classList.add('hidden');
    mentionActiveInput = null;
    mentionActiveKey = null;
}

function toggleGroupPanel(key) {

// ========================================
// 消息提示音控制（免打扰 + @ 提醒）
// ========================================
// 返回 true 表示应该抑制提示音
window.__suppressSound = function(msg) {
    if (!msg.group_id) return false; // 非群消息不抑制
    var groupId = msg.group_id;
    // 免打扰检查
    if (!groupDNDMap.get(groupId)) return false; // 未开启免打扰，正常播放
    // 开启免打扰，检查是否被 @
    if (!msg.mentions) return true; // 无 @ 信息，抑制
    var myId = getUserId();
    try {
        var ids = JSON.parse(msg.mentions);
        if (!Array.isArray(ids) || ids.indexOf(myId) === -1) return true; // 未被 @，抑制
    } catch(e) { return true; }
    return false; // 被 @ 了，不抑制
};

// ========================================
// 消息接收路由
// ========================================
onMessage = function(msg) {
    var myId = getUserId();
    var key;
    if (msg.group_id !== null && msg.group_id !== undefined && msg.group_id !== 0) {
        key = 'group:' + msg.group_id;
    } else if (msg.to_user_id !== null && msg.to_user_id !== undefined && msg.to_user_id !== 0) {
        var peerId = (msg.from_user_id === myId) ? msg.to_user_id : msg.from_user_id;
        key = 'user:' + peerId;
    } else {
        key = 'broadcast';
    }

    ensureConversationForMessage(key, msg);
    var updateLatest = shouldUseAsConversationLatest(key, msg);
    if (updateLatest) {
        lastMessages.set(key, msg);
        lastTimestamps.set(key, new Date(msg.created_at || Date.now()));
        updateSidebarPreview(key, msg);
    }

    // 新会话补充进 conversations
    if (!conversations.find(function(c) { return c.key === key; })) {
        if (key.startsWith('group:')) {
            var gid = parseInt(key.split(':')[1]);
            var g = sidebarGroups.find(function(g) { return g.id === gid; });
            if (g) conversations.push({ key: key, type: 'group', targetId: gid, name: g.name, avatarChar: g.name.charAt(0) });
        } else if (key.startsWith('user:')) {
            var uid = parseInt(key.split(':')[1]);
            var f = sidebarFriends.find(function(f) { return f.friend_id === uid; });
            if (f) {
                var name = f.remark || f.nickname || f.username || ('用户' + uid);
                conversations.push({ key: key, type: 'user', targetId: uid, name: name, avatarChar: name.charAt(0) });
            }
        }
    }

    resortSidebarItem(key);
    if (!document.querySelector('.sidebar-item[data-key="' + key + '"]')) {
        renderSidebar();
        if (activeTabKey) {
            document.querySelectorAll('.sidebar-item').forEach(function(el) { el.classList.toggle('active', el.dataset.key === activeTabKey); });
        }
    }

    if (chatTabs.has(key)) {
        var tab = chatTabs.get(key);
        var added = upsertMessage(tab.messages, msg);
        if (!added) {
            if (key === activeTabKey) {
                renderAllMessages(tab);
                tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
            }
        } else if (key === activeTabKey) {
            tab.messagesEl.innerHTML += renderOneMessage(msg);
            tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
        } else if (!msg.is_recalled && msg.from_user_id !== myId) { unreadCounts.set(key, (unreadCounts.get(key) || 0) + 1); updateTabBadge(key); }
    } else if (!msg.is_recalled && msg.from_user_id !== myId) { unreadCounts.set(key, (unreadCounts.get(key) || 0) + 1); }

    // 写入本地 IndexedDB
    msgStore.putMessage(key, msg);
    if (updateLatest) msgStore.setLastMsgID(key, msg.id);

    if (updateLatest) sortConversations();
    renderSidebar();
    updateOnlineDots();
    updateSidebarBadge(key);
    if (key === activeTabKey && !msg.is_recalled && msg.from_user_id !== getUserId()) {
        sendReadReceiptForTab(key);
    }
};

function findOpenMessageByID(messageID) {
    var found = null;
    chatTabs.forEach(function(tab, key) {
        if (found) return;
        var msg = findTabMessage(tab, messageID);
        if (msg) found = { key: key, tab: tab, msg: msg };
    });
    return found;
}

onAIStream = function(payload) {
    if (!payload || !payload.message_id) return;
    var found = findOpenMessageByID(payload.message_id);
    if (!found) return;

    var tab = found.tab;
    var msg = found.msg;
    if (payload.content !== undefined && payload.content !== null) {
        msg.content = payload.content;
    } else if (payload.delta) {
        msg.content = (msg.content || '') + payload.delta;
    }

    if (payload.error) {
        msg._streaming = false;
        msg._stream_error = payload.error;
    } else if (payload.done) {
        delete msg._streaming;
        delete msg._stream_error;
    } else {
        msg._streaming = true;
        delete msg._stream_error;
    }

    var latest = lastMessages.get(found.key);
    if (latest && latest.id === msg.id) {
        lastMessages.set(found.key, msg);
        updateSidebarPreview(found.key, msg);
    }
    msgStore.putMessage(found.key, msg);

    if (found.key === activeTabKey) {
        var nearBottom = tab.messagesEl.scrollHeight - tab.messagesEl.scrollTop - tab.messagesEl.clientHeight < 96;
        renderAllMessages(tab);
        if (nearBottom) tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
    }
};

// ========================================
// 消息渲染
// ========================================
function formatMsgTime(createdAt) {
	    if (!createdAt) return '';
	    var d = new Date(createdAt);
	    var now = new Date();
	    var time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
	    var sameDay = d.getFullYear() === now.getFullYear() &&
	                  d.getMonth() === now.getMonth() &&
	                  d.getDate() === now.getDate();
	    if (sameDay) return time;
	    return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + time;
	}

function quoteMessageSummary(msg) {
    if (!msg) return '';
    if (msg.is_recalled) return '消息已撤回';
    return getPreviewText(msg).replace(/\s+/g, ' ').substring(0, 80);
}

function renderQuoteMessage(quote) {
    if (!quote) return '';
    var sender = quote.from_user ? (quote.from_user.nickname || quote.from_user.username) : ('用户' + quote.from_user_id);
    return '<button class="quote-ref" type="button" data-quote-id="' + quote.id + '">' +
        '<span class="quote-ref-sender">' + escapeHtml(sender) + '</span>' +
        '<span class="quote-ref-text">' + escapeHtml(quoteMessageSummary(quote)) + '</span>' +
    '</button>';
}

function canRecallMessage(msg) {
    if (!msg || !msg.id || msg.is_recalled) return false;
    if (msg.from_user_id !== getUserId()) return false;
    if (!msg.to_user_id && !msg.group_id) return false;
    var createdAt = new Date(msg.created_at || 0).getTime();
    if (!createdAt) return false;
    return Date.now() - createdAt <= MESSAGE_RECALL_WINDOW_MS;
}

function renderOneMessage(msg) {
    var isMe = msg.from_user_id === getUserId();
    var cls = isMe ? 'from-me' : '';
    if (msg.is_recalled) cls += ' recalled';
    var name = msg.from_user ? (msg.from_user.nickname || msg.from_user.username) : ('用户' + msg.from_user_id);
    var body = '';
    if (msg.is_recalled) {
        body = '<div class="msg-recalled">消息已撤回</div>';
    } else {
        switch (msg.type) {
            case 'image':
                var src = msg.thumbnail_url || msg.content;
                body = '<div class="msg-image"><img src="' + escapeHtml(src) + '" loading="lazy" onclick="viewImage(\'' + escapeHtml(msg.content) + '\')"></div>';
                break;
            case 'file':
                body = '<div class="msg-file">' +
                    '<div class="file-icon">📄</div>' +
                    '<div class="file-info">' +
                        '<div class="file-name" title="' + escapeHtml(msg.file_name || '') + '">' + escapeHtml(msg.file_name || '未知文件') + '</div>' +
                        '<div class="file-size">' + formatFileSize(msg.file_size || 0) + '</div>' +
                    '</div>' +
                    '<a class="file-download" href="' + escapeHtml(msg.content) + '" download="' + escapeHtml(msg.file_name || '') + '">下载</a>' +
                '</div>';
                break;
            case 'audio':
                body = '<div class="msg-audio"><audio controls src="' + escapeHtml(msg.content) + '"></audio></div>';
                break;
            default:
                if (msg._streaming) {
                    var streamText = msg.content ? escapeHtml(msg.content) : '<span class="msg-stream-placeholder">正在生成</span>';
                    body = '<span class="msg-stream-text">' + streamText + '</span><span class="msg-stream-cursor"></span>';
                } else {
                    body = escapeHtml(msg.content);
                }
                if (msg._stream_error) {
                    body += '<div class="msg-stream-error">生成失败</div>';
                }
        }
    }
    var timeStr = formatMsgTime(msg.created_at);
    var quoteHTML = msg.is_recalled ? '' : renderQuoteMessage(msg.quote_message);
    var quoteAction = (!msg.is_recalled && (msg.to_user_id || msg.group_id))
        ? '<button class="quote-reply-btn" type="button" data-msg-id="' + msg.id + '" title="引用回复">引用</button>'
        : '';
    var recallAction = canRecallMessage(msg)
        ? '<button class="recall-message-btn" type="button" data-msg-id="' + msg.id + '" title="2 分钟内可撤回">撤回</button>'
        : '';
    var deleteAction = msg.id
        ? '<button class="delete-message-btn" type="button" data-msg-id="' + msg.id + '" title="仅从我的聊天记录中删除">删除</button>'
        : '';
    var html = '<div class="msg ' + cls + '" data-msg-id="' + msg.id + '">' +
        '<div class="bubble">' +
            '<div class="meta"><a href="/profile?user_id=' + msg.from_user_id + '" class="text-link">' + escapeHtml(name) + '</a>' +
            (timeStr ? ' <span class="msg-time">' + timeStr + '</span>' : '') + quoteAction + recallAction + deleteAction + '</div>' +
            quoteHTML +
            body +
        '</div>' +
    '</div>';
    if (typeof injectReadMark === 'function') html = injectReadMark(html, msg);
    return html;
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

function viewImage(url) {
    var viewer = document.createElement('div');
    viewer.className = 'image-viewer';
    viewer.innerHTML = '<img src="' + escapeHtml(url) + '">';
    viewer.addEventListener('click', function() { viewer.remove(); });
    document.body.appendChild(viewer);
}

function renderAllMessages(tab) {
    var html = '';
    for (var i = 0; i < tab.messages.length; i++) html += renderOneMessage(tab.messages[i]);
    tab.messagesEl.innerHTML = html;
}

function findTabMessage(tab, msgId) {
    if (!tab || !msgId) return null;
    for (var i = 0; i < tab.messages.length; i++) {
        if (tab.messages[i].id === msgId) return tab.messages[i];
    }
    return null;
}

function startQuoteReply(key, msgId) {
    var tab = chatTabs.get(key);
    var msg = findTabMessage(tab, msgId);
    if (!tab || !msg) return;
    quotedMessageByTab.set(key, msg);
    renderQuoteCompose(key);
    tab.inputEl.focus();
}

function clearQuoteReply(key) {
    quotedMessageByTab.delete(key);
    renderQuoteCompose(key);
}

function renderQuoteCompose(key) {
    var tab = chatTabs.get(key);
    if (!tab || !tab.quoteComposeEl) return;
    var msg = quotedMessageByTab.get(key);
    if (!msg) {
        tab.quoteComposeEl.classList.add('hidden');
        tab.quoteComposeEl.innerHTML = '';
        return;
    }
    var sender = msg.from_user ? (msg.from_user.nickname || msg.from_user.username) : ('用户' + msg.from_user_id);

    tab.quoteComposeEl.innerHTML =
        '<div class="quote-compose-content">' +
            '<span class="quote-compose-label">引用 ' + escapeHtml(sender) + '</span>' +

        '</div>' +
        '<button type="button" class="quote-compose-clear" onclick="clearQuoteReply(\'' + escapeHtml(key) + '\')">&times;</button>';
}

function focusMessageElement(key, msgId) {
    var tab = chatTabs.get(key);
    if (!tab || !msgId) return;
    var el = tab.messagesEl.querySelector('.msg[data-msg-id="' + msgId + '"]');
    if (!el) return;
    el.scrollIntoView({ block: 'center' });
    el.classList.add('search-hit');
    setTimeout(function() { el.classList.remove('search-hit'); }, 1600);
}

async function recallMessage(key, msgId, buttonEl) {
    var tab = chatTabs.get(key);
    var msg = findTabMessage(tab, msgId);
    if (!tab || !msg || !canRecallMessage(msg)) return;
    if (buttonEl) buttonEl.disabled = true;
    try {
        var data = await api('POST', '/messages/' + msgId + '/recall', {});
        if (data.message && onMessage) onMessage(data.message);
    } catch(e) {
        renderSendFailure(key, null, e.message || '撤回失败');
        if (buttonEl) buttonEl.disabled = false;
    }
}

async function deleteMessageForMe(key, msgId, buttonEl) {
    var tab = chatTabs.get(key);
    var msg = findTabMessage(tab, msgId);
    if (!tab || !msg || !msgId) return;
    if (!confirm('确认删除这条聊天记录？删除后仅自己不可见。')) return;
    if (buttonEl) buttonEl.disabled = true;

    try {
        await api('DELETE', '/messages/' + msgId);
        if (typeof msgStore !== 'undefined' && typeof msgStore.deleteMessage === 'function') {
            await msgStore.deleteMessage(key, msgId);
        }
        removeMessageFromTab(key, msgId);
    } catch(e) {
        renderSendFailure(key, null, e.message || '删除失败');
        if (buttonEl) buttonEl.disabled = false;
    }
}

function removeMessageFromTab(key, msgId) {
    var tab = chatTabs.get(key);
    if (!tab || !msgId) return;

    var removed = null;
    tab.messages = tab.messages.filter(function(msg) {
        if (msg.id === msgId) {
            removed = msg;
            return false;
        }
        return true;
    });
    if (!removed) return;

    messageReadBy.delete(msgId);
    var quoted = quotedMessageByTab.get(key);
    if (quoted && quoted.id === msgId) clearQuoteReply(key);
    renderAllMessages(tab);

    var latest = lastMessages.get(key);
    if (latest && latest.id === msgId) {
        lastMessages.delete(key);
        lastTimestamps.delete(key);
        loadLastMessages().then(function() {
            sortConversations();
            renderSidebar();
            updateOnlineDots();
        });
    } else {
        renderSidebar();
        updateOnlineDots();
    }
}

function mergeMessageState(existing, incoming) {
    if (!existing) return incoming;
    if (existing._read && !incoming._read) incoming._read = true;
    for (var k in incoming) {
        if (Object.prototype.hasOwnProperty.call(incoming, k)) existing[k] = incoming[k];
    }
    if (!incoming._streaming) delete existing._streaming;
    if (!incoming._stream_error) delete existing._stream_error;
    return existing;
}

function upsertMessage(list, msg) {
    for (var i = 0; i < list.length; i++) {
        if (list[i].id === msg.id) {
            mergeMessageState(list[i], msg);
            return false;
        }
    }
    list.push(msg);
    list.sort(function(a, b) { return a.id - b.id; });
    return true;
}

function mergeMessageLists(existing, incoming) {
    for (var i = 0; i < incoming.length; i++) {
        upsertMessage(existing, incoming[i]);
    }
    return existing;
}

function applyReadInfoToMessages(messages, info) {
    if (!messages || !info) return [];
    var readIds = [];
    var myId = getUserId();
    for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        var shouldMark = false;
        if (m.from_user_id === myId && info.peer_last_read && m.id <= info.peer_last_read) {
            shouldMark = true;
        } else if (m.from_user_id !== myId && info.my_last_read && m.id <= info.my_last_read) {
            shouldMark = true;
        }
        if (shouldMark && !m._read) {
            m._read = true;
            readIds.push(m.id);
        }
    }
    return readIds;
}

function persistReadMarks(key, readIds) {
    if (readIds.length > 0 && typeof msgStore !== 'undefined') msgStore.markRead(key, readIds);
}

var fileInput = null;
var audioRecorder = null;
var audioChunks = [];

(function initFileInput() {

function handleRecordToggle() {
    if (recording) stopRecord();
    else startRecord();
}

function startRecord() {
    document.getElementById('attachMenu').classList.add('hidden');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        audioRecorder = new MediaRecorder(stream);
        audioChunks = [];
        audioRecorder.ondataavailable = function(e) { audioChunks.push(e.data); };
        audioRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            var blob = new Blob(audioChunks, { type: 'audio/webm' });
            uploadAndSend(currentAttachKey, new File([blob], 'recording.webm', { type: 'audio/webm' }));
        };
        audioRecorder.start();
        recording = true;
        updateRecordUI();
    }).catch(function(e) {
        alert('无法访问麦克风: ' + e.message);
    });
}

function stopRecord() {
    if (audioRecorder) {
        audioRecorder.stop();
        audioRecorder = null;
        recording = false;
        updateRecordUI();
    }
}

function updateRecordUI() {
    var item = document.getElementById('attachRecordItem');
    if (!item) return;
    if (recording) {
        item.classList.add('recording');
        item.querySelector('span').textContent = '停止录音';
    } else {
        item.classList.remove('recording');
        item.querySelector('span').textContent = '录音';
    }
}

async function uploadAndSend(key, file) {
    if (!key) return;
    var formData = new FormData();
    formData.append('file', file);

    try {
        var resp = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + getToken() },
            body: formData
        });
        var data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '上传失败');

        var type = 'file';
        if (file.type.startsWith('image/')) type = 'image';
        else if (file.type.startsWith('audio/')) type = 'audio';

        var msg = {
            type: type,
            from_user_id: getUserId(),
            content: data.url,
            file_name: data.file_name,
            file_size: data.file_size,
            thumbnail_url: data.thumbnail_url || ''
        };

        var tab = chatTabs.get(key);
        if (!tab) return;
        if (tab.type === 'user') msg.to_user_id = tab.targetId;
        else if (tab.type === 'group') msg.group_id = tab.targetId;
        var quoted = quotedMessageByTab.get(key);
        if (quoted) msg.quote_message_id = quoted.id;

        var requestId = sendWS(msg);
        registerPendingSend(requestId, key, msg);
        clearQuoteReply(key);
    } catch(e) {
        alert('上传失败: ' + e.message);
    }
}

// ========================================
// 发送消息（含 @ 提及提取）
// ========================================
function sendMessage(key) {
    var tab = chatTabs.get(key || activeTabKey);
    if (!tab) return;
    var content = tab.inputEl.value.trim();
    if (!content) return;

    var msg = { type: 'text', from_user_id: getUserId(), content: content };
    if (tab.type === 'user') { msg.to_user_id = tab.targetId; }
    else if (tab.type === 'group') {
        msg.group_id = tab.targetId;
        // 提取 @ 提及的用户 ID
        var members = groupMembersMap.get(tab.targetId) || [];
        var mentionIds = [];
        var re = /@(\S+)/g;
        var match;
        while ((match = re.exec(content)) !== null) {
            var atName = match[1].toLowerCase();
            var found = members.find(function(m) {
                var dn = (m.nickname || m.username || '').toLowerCase();
                return dn === atName;
            });
            if (found && mentionIds.indexOf(found.user_id) === -1) mentionIds.push(found.user_id);
        }
        if (mentionIds.length > 0) msg.mentions = JSON.stringify(mentionIds);
    }
    var quoted = quotedMessageByTab.get(key || activeTabKey);
    if (quoted) msg.quote_message_id = quoted.id;

    var requestId = sendWS(msg);
    registerPendingSend(requestId, key || activeTabKey, msg);
    tab.inputEl.value = '';
    clearQuoteReply(key || activeTabKey);
    if (tab.type === 'user') sendTyping(tab.targetId, 0, false);
    else if (tab.type === 'group') sendTyping(0, tab.targetId, false);
};

// 历史消息加载
// ========================================
async function loadHistory(key, page) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    page = page || 1;

    // 初始加载：先从本地 IndexedDB 瞬时渲染
    if (page === 1 && !tab._localLoaded) {
        tab._localLoaded = true;
        try {
            var cached = await msgStore.getMessages(key);
            if (cached.length > 0) {
                tab.messages = cached;
                renderAllMessages(tab);
                tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
            }
        } catch(e) {}
    }

    // 状态更新会复用旧消息 ID，首屏固定拉最新页，避免本地缓存错过撤回态。
    var url, afterID = 0;
    if (tab.type === 'user') {
        url = '/history?peer_id=' + tab.targetId + '&page=' + page + '&page_size=30';
    } else if (tab.type === 'group') {
        url = '/history/group/' + tab.targetId + '?page=' + page + '&page_size=30';
    } else {
        url = '/history/broadcast?page=' + page + '&page_size=30';
    }

    try {
        var data = await api('GET', url);
        tab._loading = false;
        if (!data.messages || data.messages.length === 0) {
            if (data.read_info) {
                persistReadMarks(key, applyReadInfoToMessages(tab.messages, data.read_info));
                if (key === activeTabKey && typeof refreshReadMarks === 'function') refreshReadMarks(tab);
            }
            if (tab.type === 'group' && typeof loadGroupReads === 'function' && tab.targetId) loadGroupReads(tab.targetId, tab);
            if (!afterID) tab.hasMore = false;
            return;
        }

        // after_id 增量时服务端返回升序，全量时为降序需反转
        var newMsgs = afterID ? data.messages : data.messages.reverse();

        // 根据服务端 read_info 恢复已读标记
        if (data.read_info) {
            persistReadMarks(key, applyReadInfoToMessages(afterID ? tab.messages.concat(newMsgs) : newMsgs, data.read_info));
        }

        // 合并消息（按 ID 去重）
        var existingIds = new Set(tab.messages.map(function(m) { return m.id; }));
        var toAdd = newMsgs.filter(function(m) { return !existingIds.has(m.id); });

        if (page === 1 && afterID) {
            tab.messages = tab.messages.concat(toAdd);               // 增量追加
        } else if (page === 1) {
            tab.messages = mergeMessageLists(tab.messages, newMsgs); // 首次全量
        } else {
            tab.messages = toAdd.concat(tab.messages);               // 翻页前置
        }

        // 服务端返回的同 ID 状态也要回写本地缓存，例如撤回状态。
        if (newMsgs.length > 0) {
            msgStore.putMessages(key, newMsgs);
            var maxID = newMsgs.reduce(function(max, m) { return m.id > max ? m.id : max; }, 0);
            if (page === 1 && maxID > 0) msgStore.setLastMsgID(key, maxID);
        }

        var oldScrollHeight = tab.messagesEl.scrollHeight;
        renderAllMessages(tab);
        if (page === 1) tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
        else { tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight - oldScrollHeight; }

        // 消息加载完成后发送已读回执（switchToTab 时 tab.messages 尚为空）
        sendReadReceiptForTab(key);
        if (tab.type === 'group' && typeof loadGroupReads === 'function' && tab.targetId) loadGroupReads(tab.targetId, tab);
        tab.historyPage = page + 1;
        if (data.messages.length < (afterID ? 50 : 30)) tab.hasMore = false;
    } catch(e) { tab._loading = false; console.error(e); }
}

async function searchMessagesInTab(key) {
    var tab = chatTabs.get(key);
    if (!tab || !tab.searchInputEl) return;
    var q = (tab.searchInputEl.value || '').trim();
    var startTime = tab.searchStartEl ? tab.searchStartEl.value : '';
    var endTime = tab.searchEndEl ? tab.searchEndEl.value : '';
    if (!q && !startTime && !endTime) { clearSearchResults(key); return; }

    var url = '/search/messages?type=' + encodeURIComponent(tab.type) +
        '&q=' + encodeURIComponent(q) + '&page=1&page_size=30';
    if (tab.type === 'user' || tab.type === 'group') {
        url += '&target_id=' + encodeURIComponent(tab.targetId);
    }
    if (startTime) url += '&start_time=' + encodeURIComponent(startTime);
    if (endTime) url += '&end_time=' + encodeURIComponent(endTime);

    tab.searchResultsEl.classList.remove('hidden');
    tab.searchClearEl.classList.remove('hidden');
    tab.searchResultsEl.innerHTML = '<div class="search-state">搜索中...</div>';

    try {
        var data = await api('GET', url);
        renderSearchResults(key, data.messages || [], data.total || 0, q);
    } catch(e) {
        tab.searchResultsEl.innerHTML = '<div class="search-state">搜索失败: ' + escapeHtml(e.message) + '</div>';
    }
}

function renderSearchResults(key, messages, total, q) {
    var tab = chatTabs.get(key);
    if (!tab || !tab.searchResultsEl) return;
    if (!messages.length) {
        tab.searchResultsEl.innerHTML = '<div class="search-state">没有找到相关消息</div>';
        return;
    }

    var html = '<div class="search-summary">找到 ' + total + ' 条结果</div>';
    for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        var sender = m.from_user ? (m.from_user.nickname || m.from_user.username) : ('用户' + m.from_user_id);
        html += '<button class="search-result" type="button" data-msg-id="' + m.id + '">' +
            '<span class="search-result-meta">' + escapeHtml(sender) + ' · ' + escapeHtml(formatMsgTime(m.created_at)) + '</span>' +
            '<span class="search-result-text">' + highlightSearchText(getPreviewText(m), q) + '</span>' +
        '</button>';
    }

    tab.searchResultsEl.innerHTML = html;
    tab.searchResultsEl.querySelectorAll('.search-result').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var id = parseInt(this.dataset.msgId || '0', 10);
            var msg = null;
            for (var i = 0; i < messages.length; i++) {
                if (messages[i].id === id) { msg = messages[i]; break; }
            }
            focusSearchResult(key, msg);
        });
    });
}

function clearSearchResults(key) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    if (tab.searchInputEl) tab.searchInputEl.value = '';
    if (tab.searchStartEl) tab.searchStartEl.value = '';
    if (tab.searchEndEl) tab.searchEndEl.value = '';
    if (tab.searchResultsEl) {
        tab.searchResultsEl.classList.add('hidden');
        tab.searchResultsEl.innerHTML = '';
    }
    if (tab.searchClearEl) tab.searchClearEl.classList.add('hidden');
}

function focusSearchResult(key, msg) {
    if (!msg) return;
    var tab = chatTabs.get(key);
    if (!tab) return;

    if (upsertMessage(tab.messages, msg)) {
        renderAllMessages(tab);
    }

    focusMessageElement(key, msg.id);
}

function highlightSearchText(text, q) {
    text = text || '';
    q = q || '';
    if (!q) return escapeHtml(text);
    var lower = text.toLowerCase();
    var needle = q.toLowerCase();
    var idx = lower.indexOf(needle);
    if (idx < 0) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) +
        '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>' +
        escapeHtml(text.slice(idx + q.length));
}

async function globalSearchMessages() {
    var inputEl = document.getElementById('globalSearchInput');
    var startEl = document.getElementById('globalSearchStart');
    var endEl = document.getElementById('globalSearchEnd');
    var groupedEl = document.getElementById('globalSearchGrouped');
    var resultsEl = document.getElementById('globalSearchResults');
    var q = (inputEl.value || '').trim();
    var startTime = startEl.value || '';
    var endTime = endEl.value || '';
    var grouped = groupedEl.checked;
    if (!q && !startTime && !endTime) { clearGlobalSearch(); return; }

    var url = '/search/messages?type=all&page=1&page_size=50&q=' + encodeURIComponent(q);
    if (startTime) url += '&start_time=' + encodeURIComponent(startTime);
    if (endTime) url += '&end_time=' + encodeURIComponent(endTime);
    if (grouped) url += '&group_by=conversation';

    resultsEl.classList.remove('hidden');
    resultsEl.innerHTML = '<div class="search-state">查找中...</div>';
    try {
        var data = await api('GET', url);
        renderGlobalSearchResults(data, q, grouped);
    } catch(e) {
        resultsEl.innerHTML = '<div class="search-state">查找失败: ' + escapeHtml(e.message) + '</div>';
    }
}

function clearGlobalSearch() {
    document.getElementById('globalSearchInput').value = '';
    document.getElementById('globalSearchStart').value = '';
    document.getElementById('globalSearchEnd').value = '';
    var resultsEl = document.getElementById('globalSearchResults');
    resultsEl.classList.add('hidden');
    resultsEl.innerHTML = '';
}

function renderGlobalSearchResults(data, q, grouped) {
    var resultsEl = document.getElementById('globalSearchResults');
    var hits = [];
    var html = '<div class="search-summary">找到 ' + (data.total || 0) + ' 条结果</div>';

    if (grouped && data.conversations && data.conversations.length) {
        for (var i = 0; i < data.conversations.length; i++) {
            var group = data.conversations[i];
            html += '<div class="global-search-group">' + escapeHtml(conversationTitle(group.conversation_type, group.conversation_id)) +
                '<span>' + group.count + '</span></div>';
            var msgs = group.messages || [];
            for (var j = 0; j < msgs.length; j++) {
                hits.push(msgs[j]);
                html += globalSearchResultButton(hits.length - 1, msgs[j], q);
            }
        }
    } else {
        var messages = data.messages || [];
        for (var k = 0; k < messages.length; k++) {
            hits.push(messages[k]);
            html += globalSearchResultButton(hits.length - 1, messages[k], q);
        }
    }

    if (hits.length === 0) html += '<div class="search-state">没有找到相关消息</div>';
    resultsEl.innerHTML = html;
    resultsEl.querySelectorAll('.global-search-result').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var idx = parseInt(this.dataset.index || '-1', 10);
            if (idx >= 0 && hits[idx]) openSearchResultMessage(hits[idx]);
        });
    });
}

function globalSearchResultButton(index, msg, q) {
    var sender = msg.from_user ? (msg.from_user.nickname || msg.from_user.username) : ('用户' + msg.from_user_id);
    return '<button class="search-result global-search-result" type="button" data-index="' + index + '">' +
        '<span class="search-result-meta">' + escapeHtml(conversationTitleForMessage(msg)) + ' · ' +
            escapeHtml(sender) + ' · ' + escapeHtml(formatMsgTime(msg.created_at)) + '</span>' +
        '<span class="search-result-text">' + highlightSearchText(getPreviewText(msg), q) + '</span>' +
    '</button>';
}

function conversationTitleForMessage(msg) {
    var conv = conversationFromMessage(msg);
    return conversationTitle(conv.type, conv.targetId);
}

function conversationTitle(type, targetId) {
    if (type === 'broadcast') return '广播消息';
    var key = type + ':' + targetId;
    var conv = conversations.find(function(c) { return c.key === key; });
    if (conv) return conv.name;
    if (type === 'group') return '群组' + targetId;
    return '用户' + targetId;
}

function conversationFromMessage(msg) {
    if (msg.group_id !== null && msg.group_id !== undefined && msg.group_id !== 0) {
        return { key: 'group:' + msg.group_id, type: 'group', targetId: msg.group_id };
    }
    if (msg.to_user_id !== null && msg.to_user_id !== undefined && msg.to_user_id !== 0) {
        var peerId = msg.from_user_id === getUserId() ? msg.to_user_id : msg.from_user_id;
        return { key: 'user:' + peerId, type: 'user', targetId: peerId };
    }
    return { key: 'broadcast', type: 'broadcast', targetId: 0 };
}

function openSearchResultMessage(msg) {
    var conv = conversationFromMessage(msg);
    ensureConversationForMessage(conv.key, msg);
    openOrSwitchTab(conv.key, conv.type, conv.targetId, conversationTitle(conv.type, conv.targetId));
    setTimeout(function() { focusSearchResult(conv.key, msg); }, 120);
}

// ========================================
// URL 参数处理
// ========================================
var pendingOpenKey = null, pendingOpenType = null, pendingOpenTarget = null;
var urlParams = new URLSearchParams(window.location.search);
var peerParam = urlParams.get('peer');
var typeParam = urlParams.get('type') || 'user';
if (peerParam) {
    var targetId = parseInt(peerParam);
    pendingOpenType = typeParam === 'group' ? 'group' : 'user';
    pendingOpenTarget = targetId;
    pendingOpenKey = pendingOpenType + ':' + targetId;
}

function escapeHtml(s) {
    var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

// ========================================
// 在线状态加载
// ========================================
async function loadOnlineStatus() {
    try {
        var data = await api('GET', '/friends/online');
        (data.friends || []).forEach(function(f) {
            if (f.is_online) onlineUsers.add(f.id);
        });
        updateOnlineDots();
    } catch(e) {}
}

async function syncAfterOnline() {
    if (!chatInitialized) {
        pendingOnlineSync = true;
        return;
    }
    if (onlineSyncRunning) {
        pendingOnlineSync = true;
        return;
    }

    onlineSyncRunning = true;
    pendingOnlineSync = false;
    try {
        await loadLastMessages();
        sortConversations();
        renderSidebar();
        updateOnlineDots();

        var keys = Array.from(chatTabs.keys());
        for (var i = 0; i < keys.length; i++) {
            var tab = chatTabs.get(keys[i]);
            if (!tab) continue;
            tab.hasMore = true;
            await loadHistory(keys[i], 1);
        }
    } finally {
        onlineSyncRunning = false;
        if (pendingOnlineSync) syncAfterOnline();
    }
}

onWSOpen = function() {
    syncAfterOnline();
};

onWSAck = function(payload) {
    var requestId = payload && payload.request_id;
    if (requestId) pendingSends.delete(requestId);
};

onWSError = function(payload) {
    payload = payload || {};
    var requestId = payload.request_id || '';
    var pending = requestId ? pendingSends.get(requestId) : null;
    if (requestId) pendingSends.delete(requestId);

    var message = payload.message || '发送失败';
    if (pending) {
        renderSendFailure(pending.key, pending.message, message);
        return;
    }
    renderSendFailure(activeTabKey, null, message);
};

function registerPendingSend(requestId, key, msg) {
    if (!requestId || !key || !msg) return;
    pendingSends.set(requestId, {
        key: key,
        message: Object.assign({}, msg),
        createdAt: Date.now()
    });
}

function renderSendFailure(key, msg, reason) {
    var tab = key ? chatTabs.get(key) : null;
    var text = msg ? getPreviewText(msg) : '';
    var html = '<div class="send-failure">' +
        '<strong>发送失败</strong>' +
        '<span>' + escapeHtml(reason || '请求处理失败') + '</span>' +
        (text ? '<em>' + escapeHtml(text) + '</em>' : '') +
    '</div>';
    if (tab && tab.messagesEl) {
        tab.messagesEl.innerHTML += html;
        tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
        if (msg && msg.type === 'text' && tab.inputEl && !tab.inputEl.value) {
            tab.inputEl.value = msg.content || '';
        }
        return;
    }
    alert('发送失败: ' + (reason || '请求处理失败'));
}

function refreshRecallButtons() {
    chatTabs.forEach(function(tab) {
        if (!tab || !tab.messages || !tab.messagesEl) return;
        var hasVisibleRecallWindow = tab.messages.some(function(msg) {
            if (!msg || msg.from_user_id !== getUserId() || msg.is_recalled) return false;
            var createdAt = new Date(msg.created_at || 0).getTime();
            if (!createdAt) return false;
            return Date.now() - createdAt <= MESSAGE_RECALL_WINDOW_MS + 30000;
        });
        if (hasVisibleRecallWindow) renderAllMessages(tab);
    });
}
setInterval(refreshRecallButtons, 30000);

// ========================================
// 初始化
// ========================================
async function init() {
    ['globalSearchInput', 'globalSearchStart', 'globalSearchEnd'].forEach(function(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                globalSearchMessages();
            }
        });
    });
    await Promise.all([loadFriends(), loadGroups(), loadAIBots(), loadOnlineStatus()]);
    await loadGroupMetadata();
    buildConversations();
    await loadLastMessages();
    sortConversations();
    renderSidebar();
    updateOnlineDots(); // 侧边栏渲染完成后才能注入绿点
    if (pendingOpenKey) {
        var conv = conversations.find(function(c) { return c.key === pendingOpenKey; });
        var name = conv ? conv.name : ('用户' + pendingOpenTarget);
        openOrSwitchTab(pendingOpenKey, pendingOpenType, pendingOpenTarget, name);
    }
    chatInitialized = true;
    if (pendingOnlineSync) syncAfterOnline();
}

loadAndApplySettings();
init();
</script>
