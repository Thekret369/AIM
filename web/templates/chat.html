<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM — 消息</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
    <span>AIM</span>
    <div>
        <a href="/profile" id="navUser" class="nav-user-link"></a>
        <a href="/contacts">联系人</a>
        <a href="/chat">消息</a>
        <a href="/groups">群组</a>
        <a href="/settings">设置</a>
    </div>
</div>

<div class="chat-layout">
    <!-- 左侧边栏：统一会话列表 -->
    <div class="chat-sidebar">
        <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="chat-main" id="chatMain">
        <div class="tab-bar" id="tabBar"></div>
        <div style="display:flex;flex:1;overflow:hidden">
            <div class="tab-panels" id="tabPanels">
                <div class="no-chat-placeholder" id="noChatPlaceholder">选择好友或群组开始聊天</div>
            </div>
            <!-- 群详情右侧抽屉 -->
            <div class="group-panel hidden" id="groupPanel">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #e0e4e8;background:#f9f9f9;flex-shrink:0">
                    <span style="font-weight:500" id="gpTitle">群详情</span>
                    <span style="display:flex;align-items:center;gap:8px">
                        <button class="btn btn-sm" id="gpDndBtn" onclick="toggleGroupDND()" style="font-size:11px" title="免打扰">🔔</button>
                        <span style="cursor:pointer;font-size:18px;color:#999;line-height:1" onclick="closeGroupPanel()">&times;</span>
                    </span>
                </div>
                <div class="group-panel-tabs">
                    <button class="gp-tab-btn active" data-gp-tab="info" onclick="switchGroupPanelTab('info')">群资料</button>
                    <button class="gp-tab-btn" data-gp-tab="announce" onclick="switchGroupPanelTab('announce')">群公告</button>
                    <button class="gp-tab-btn" data-gp-tab="members" onclick="switchGroupPanelTab('members')">成员</button>
                </div>
                <div class="group-panel-body" id="groupPanelBody"></div>
            </div>
        </div>
    </div>
</div>

<!-- @ 提及成员选择弹层 -->
<div class="mention-dropdown hidden" id="mentionDropdown"></div>

<script src="/static/app.js"></script>
<script>
checkAuth();

var navUserEl = document.getElementById('navUser');
navUserEl.textContent = getUserNickname();
navUserEl.href = '/profile';

// ========================================
// 核心状态
// ========================================
let sidebarFriends = [];
let sidebarGroups = [];
let conversations = [];
let lastTimestamps = new Map();
let chatTabs = new Map();
let activeTabKey = null;
let unreadCounts = new Map();
let lastMessages = new Map();

// 群相关缓存
let groupMembersMap = new Map();   // groupId → members[]
let groupDNDMap = new Map();        // groupId → bool

// 群详情面板状态
let currentGroupPanelKey = null;
let groupPanelData = null;
let groupPanelActiveTab = 'info';

// @ 提及状态
let mentionActiveInput = null;
let mentionActiveKey = null;

// ========================================
// 数据加载
// ========================================
async function loadFriends() {
    try {
        const data = await api('GET', '/friends');
        sidebarFriends = data.friends || [];
    } catch(e) { sidebarFriends = []; }
}

async function loadGroups() {
    try {
        const data = await api('GET', '/groups');
        sidebarGroups = data.groups || [];
    } catch(e) { sidebarGroups = []; }
}

// 预加载所有群的 DND 状态和成员列表
async function loadGroupMetadata() {
    var promises = sidebarGroups.map(function(g) {
        return api('GET', '/groups/' + g.id).then(function(data) {
            groupDNDMap.set(g.id, data.dnd || false);
        }).catch(function() {});
    });
    await Promise.all(promises);
}

// ========================================
// 统一会话列表构建 & 排序
// ========================================
function buildConversations() {
    conversations = [];
    conversations.push({
        key: 'broadcast',
        type: 'broadcast',
        targetId: 0,
        name: '广播消息',
        avatarChar: '📢'
    });
    sidebarFriends.forEach(function(f) {
        var name = f.remark || f.nickname || f.username || ('用户' + f.friend_id);
        conversations.push({
            key: 'user:' + f.friend_id, type: 'user', targetId: f.friend_id,
            name: name, avatarChar: name.charAt(0)
        });
    });
    sidebarGroups.forEach(function(g) {
        conversations.push({
            key: 'group:' + g.id, type: 'group', targetId: g.id,
            name: g.name, avatarChar: g.name.charAt(0)
        });
    });
}

function sortConversations() {
    conversations.sort(function(a, b) {
        if (a.key === 'broadcast') return -1;
        if (b.key === 'broadcast') return 1;
        var ta = lastTimestamps.get(a.key);
        var tb = lastTimestamps.get(b.key);
        if (ta && !tb) return -1;
        if (!ta && tb) return 1;
        if (!ta && !tb) return 0;
        return tb - ta;
    });
}

function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var yesterday = new Date(today.getTime() - 86400000);
    var msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (msgDay.getTime() === today.getTime()) {
        var h = d.getHours(), m = d.getMinutes();
        return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    } else if (msgDay.getTime() === yesterday.getTime()) {
        return '昨天';
    } else if (msgDay.getTime() > today.getTime() - 604800000) {
        var days = ['日', '一', '二', '三', '四', '五', '六'];
        return '周' + days[d.getDay()];
    } else {
        return (d.getMonth() + 1) + '/' + d.getDate();
    }
}

async function loadLastMessages() {
    var fetches = conversations.map(function(c) {
        var url;
        if (c.type === 'user') url = '/history?peer_id=' + c.targetId + '&page=1&page_size=1';
        else if (c.type === 'group') url = '/history/group/' + c.targetId + '?page=1&page_size=1';
        else url = '/history/broadcast?page=1&page_size=1';
        return api('GET', url).then(function(data) {
            if (data.messages && data.messages.length > 0) {
                var msg = data.messages[0];
                lastMessages.set(c.key, msg);
                if (msg.created_at) lastTimestamps.set(c.key, new Date(msg.created_at));
            }
        }).catch(function() {});
    });
    await Promise.all(fetches);
}

// ========================================
// 侧边栏渲染
// ========================================
function renderSidebar() {
    var list = document.getElementById('sidebarList');
    var html = '';
    conversations.forEach(function(c) {
        var unread = unreadCounts.get(c.key) || 0;
        var preview = lastMessages.get(c.key);
        var ts = lastTimestamps.get(c.key);
        var dnd = false;
        if (c.type === 'group') dnd = groupDNDMap.get(c.targetId) || false;
        html += sidebarItemHTML(c.key, c.type, c.targetId, c.avatarChar, c.name, preview, unread, ts, dnd);
    });
    list.innerHTML = html || '<div style="padding:20px;text-align:center;color:#999;">暂无会话</div>';
    list.querySelectorAll('.sidebar-item').forEach(function(el) {
        el.addEventListener('click', function() {
            var key = this.dataset.key, type = this.dataset.type;
            var targetId = parseInt(this.dataset.target) || 0;
            var name = this.querySelector('.item-name').textContent;
            openOrSwitchTab(key, type, targetId, name);
        });
    });
}

function sidebarItemHTML(key, type, targetId, avatarChar, name, previewMsg, unread, timestamp, dnd) {
    var activeClass = (key === activeTabKey) ? ' active' : '';
    var badgeHTML = unread > 0 ? '<span class="badge" style="display:inline-block">' + unread + '</span>' : '';
    var previewHTML = previewMsg ? (previewMsg.content || '[图片]').substring(0, 20) : '';
    var timeHTML = timestamp ? '<span class="item-time">' + formatTime(timestamp) + '</span>' : '';
    var dndIcon = dnd ? '<span class="item-dnd" style="font-size:10px;margin-right:2px">🔕</span>' : '';
    return '<div class="sidebar-item' + activeClass + '" data-key="' + key + '" data-type="' + type + '" data-target="' + targetId + '">' +
        '<div class="avatar">' + escapeHtml(avatarChar) + '</div>' +
        '<div class="item-info">' +
            '<div class="item-name">' + dndIcon + escapeHtml(name) + '</div>' +
            (previewHTML ? '<div class="item-preview">' + escapeHtml(previewHTML) + '</div>' : '') +
        '</div>' + timeHTML + badgeHTML +
    '</div>';
}

function updateSidebarBadge(key) {
    var el = document.querySelector('.sidebar-item[data-key="' + key + '"]');
    if (!el) return;
    var badgeEl = el.querySelector('.badge');
    var count = unreadCounts.get(key) || 0;
    if (count > 0) {
        if (!badgeEl) { badgeEl = document.createElement('span'); badgeEl.className = 'badge'; el.appendChild(badgeEl); }
        badgeEl.textContent = count; badgeEl.style.display = 'inline-block';
    } else if (badgeEl) { badgeEl.style.display = 'none'; }
}

function updateSidebarPreview(key, msg) {
    var el = document.querySelector('.sidebar-item[data-key="' + key + '"] .item-preview');
    if (!el) return;
    el.textContent = (msg.content || '[图片]').substring(0, 20);
}

function resortSidebarItem(key) {
    var el = document.querySelector('.sidebar-item[data-key="' + key + '"]');
    if (!el || key === 'broadcast') return;
    sortConversations();
    var idx = -1;
    for (var i = 0; i < conversations.length; i++) { if (conversations[i].key === key) { idx = i; break; } }
    if (idx === -1) return;
    var list = document.getElementById('sidebarList');
    var nextKey = (idx + 1 < conversations.length) ? conversations[idx + 1].key : null;
    var nextEl = nextKey ? list.querySelector('.sidebar-item[data-key="' + nextKey + '"]') : null;
    if (nextEl) list.insertBefore(el, nextEl); else list.appendChild(el);
}

// ========================================
// 标签管理
// ========================================
function openOrSwitchTab(key, type, targetId, name) {
    if (chatTabs.has(key)) { switchToTab(key); }
    else { createTab(key, type, targetId, name); switchToTab(key); loadHistory(key, 1); }
    unreadCounts.set(key, 0);
    updateSidebarBadge(key); updateTabBadge(key); renderSidebar();
}

function createTab(key, type, targetId, name) {
    var tabEl = document.createElement('span');
    tabEl.className = 'chat-tab';
    tabEl.innerHTML = '<span class="tab-name">' + escapeHtml(name) + '</span>' +
        '<span class="tab-badge" style="display:none"></span>' +
        '<span class="tab-close">&times;</span>';
    tabEl.querySelector('.tab-name').addEventListener('click', function(e) { e.stopPropagation(); switchToTab(key); });
    tabEl.querySelector('.tab-close').addEventListener('click', function(e) { e.stopPropagation(); closeTab(key); });
    document.getElementById('tabBar').appendChild(tabEl);

    var panelEl = document.createElement('div');
    panelEl.className = 'tab-panel hidden';
    if (type === 'group') {
        panelEl.innerHTML =
            '<div class="chat-header" style="display:flex;justify-content:space-between;align-items:center">' +
                '<span>' + escapeHtml(name) + '</span>' +
                '<button class="btn btn-sm btn-primary" style="font-size:12px;padding:2px 10px">群详情</button>' +
            '</div>' +
            '<div class="chat-messages"></div>' +
            '<div class="chat-input">' +
                '<input type="text" placeholder="输入消息，@ 提及成员...">' +
                '<button>发送</button>' +
            '</div>';
    } else {
        panelEl.innerHTML =
            '<div class="chat-header">' + escapeHtml(name) + '</div>' +
            '<div class="chat-messages"></div>' +
            '<div class="chat-input">' +
                '<input type="text" placeholder="输入消息...">' +
                '<button>发送</button>' +
            '</div>';
    }
    var inputEl = panelEl.querySelector('input');
    var btnEl = panelEl.querySelector('button');
    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage(key);
    });
    btnEl.addEventListener('click', function() { sendMessage(key); });

    // 群聊 @ 提及支持
    if (type === 'group') {
        inputEl.addEventListener('input', function(e) { onMentionInput(key, this); });
        inputEl.addEventListener('blur', function() { setTimeout(hideMentionDropdown, 200); });
        // 预加载成员列表
        if (!groupMembersMap.has(targetId)) {
            api('GET', '/groups/' + targetId + '/members').then(function(data) {
                groupMembersMap.set(targetId, data.members || []);
            }).catch(function() {});
        }
    }

    document.getElementById('tabPanels').appendChild(panelEl);

    var panelMessagesEl = panelEl.querySelector('.chat-messages');
    panelMessagesEl.addEventListener('scroll', function() {
        if (this.scrollTop < 40 && chatTabs.has(key)) {
            var tab = chatTabs.get(key);
            if (tab.hasMore && !tab._loading) { tab._loading = true; loadHistory(key, tab.historyPage); }
        }
    });

    var headerEl = panelEl.querySelector('.chat-header');

    chatTabs.set(key, {
        type: type, targetId: targetId, name: name,
        messages: [], historyPage: 1, hasMore: true, _loading: false,
        panelEl: panelEl, messagesEl: panelMessagesEl,
        inputEl: inputEl, headerEl: headerEl, tabEl: tabEl
    });

    if (type === 'group') {
        headerEl.querySelector('button').addEventListener('click', function(e) {
            e.stopPropagation(); toggleGroupPanel(key);
        });
    }
}

function switchToTab(key) {
    if (activeTabKey && chatTabs.has(activeTabKey)) {
        var old = chatTabs.get(activeTabKey);
        old.panelEl.classList.add('hidden'); old.tabEl.classList.remove('active');
    }
    var tab = chatTabs.get(key);
    tab.panelEl.classList.remove('hidden'); tab.tabEl.classList.add('active');
    activeTabKey = key; tab.inputEl.focus();
    var placeholder = document.getElementById('noChatPlaceholder');
    if (placeholder) placeholder.style.display = 'none';
    document.querySelectorAll('.sidebar-item').forEach(function(el) {
        el.classList.toggle('active', el.dataset.key === key);
    });
    var panel = document.getElementById('groupPanel');
    if (!panel.classList.contains('hidden')) {
        if (tab.type === 'group') { currentGroupPanelKey = key; loadGroupPanel(key); }
        else closeGroupPanel();
    }
}

function closeTab(key) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    var wasActive = (key === activeTabKey);
    var keys = Array.from(chatTabs.keys());
    var idx = keys.indexOf(key);
    var fallbackKey = keys[idx + 1] || keys[idx - 1] || null;
    if (currentGroupPanelKey === key) closeGroupPanel();
    tab.panelEl.remove(); tab.tabEl.remove(); chatTabs.delete(key);
    if (wasActive) {
        activeTabKey = null;
        if (fallbackKey) switchToTab(fallbackKey);
        else { var ph = document.getElementById('noChatPlaceholder'); if (ph) ph.style.display = ''; }
    }
}

function updateTabBadge(key) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    var badgeEl = tab.tabEl.querySelector('.tab-badge');
    var count = unreadCounts.get(key) || 0;
    if (count > 0) { badgeEl.textContent = count; badgeEl.style.display = 'inline'; }
    else badgeEl.style.display = 'none';
}

// ========================================
// @ 提及下拉
// ========================================
function onMentionInput(key, inputEl) {
    var val = inputEl.value;
    var cursorPos = inputEl.selectionStart;
    // 找到光标前最近的 @
    var atIdx = val.lastIndexOf('@', cursorPos - 1);
    if (atIdx === -1 || (atIdx > 0 && val.charAt(atIdx - 1) !== ' ' && val.charAt(atIdx - 1) !== '')) {
        // @ 不在词首则隐藏（简单处理：@ 前面必须是空格或行首）
        if (atIdx > 0 && val.charAt(atIdx - 1) !== ' ') { hideMentionDropdown(); return; }
    }
    if (atIdx === -1) { hideMentionDropdown(); return; }

    var filter = val.substring(atIdx + 1, cursorPos).toLowerCase();
    var parts = key.split(':');
    var groupId = parseInt(parts[1]);
    var members = groupMembersMap.get(groupId) || [];
    if (members.length === 0) return;

    var myId = getUserId();
    var filtered = members.filter(function(m) {
        if (m.user_id === myId) return false; // 不 @ 自己
        var dn = (m.nickname || m.username || '').toLowerCase();
        return filter === '' || dn.indexOf(filter) !== -1;
    });

    if (filtered.length === 0) { hideMentionDropdown(); return; }

    mentionActiveInput = inputEl;
    mentionActiveKey = key;
    var dd = document.getElementById('mentionDropdown');
    dd.innerHTML = filtered.map(function(m) {
        var dn = m.nickname || m.username || ('用户' + m.user_id);
        return '<div class="mention-item" data-user-id="' + m.user_id + '" data-name="' + escapeHtml(dn) + '" onclick="insertMention(this)">' +
            '<span class="mention-avatar">' + escapeHtml(dn.charAt(0)) + '</span>' +
            '<span>' + escapeHtml(dn) + '</span>' +
        '</div>';
    }).join('');
    dd.classList.remove('hidden');
    // 定位到输入框上方
    var rect = inputEl.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.top - dd.offsetHeight - 4) + 'px';
    dd.style.minWidth = '180px';
}

function insertMention(el) {
    if (!mentionActiveInput) return;
    var name = el.dataset.name;
    var inputEl = mentionActiveInput;
    var val = inputEl.value;
    var cursorPos = inputEl.selectionStart;
    var atIdx = val.lastIndexOf('@', cursorPos - 1);
    if (atIdx === -1) return;
    var before = val.substring(0, atIdx);
    var after = val.substring(cursorPos);
    inputEl.value = before + '@' + name + ' ' + after;
    var newPos = before.length + name.length + 2;
    inputEl.setSelectionRange(newPos, newPos);
    inputEl.focus();
    hideMentionDropdown();
}

function hideMentionDropdown() {
    document.getElementById('mentionDropdown').classList.add('hidden');
    mentionActiveInput = null;
    mentionActiveKey = null;
}

// ========================================
// 群详情面板
// ========================================
function toggleGroupPanel(key) {
    var panel = document.getElementById('groupPanel');
    if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        currentGroupPanelKey = key; groupPanelActiveTab = 'info';
        document.querySelectorAll('.group-panel-tabs .gp-tab-btn').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.gpTab === 'info'); });
        loadGroupPanel(key);
    } else if (currentGroupPanelKey === key) { closeGroupPanel(); }
    else { currentGroupPanelKey = key; groupPanelActiveTab = 'info';
        document.querySelectorAll('.group-panel-tabs .gp-tab-btn').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.gpTab === 'info'); });
        loadGroupPanel(key); }
}

function closeGroupPanel() { document.getElementById('groupPanel').classList.add('hidden'); currentGroupPanelKey = null; groupPanelData = null; }

function switchGroupPanelTab(tab) {
    groupPanelActiveTab = tab;
    document.querySelectorAll('.group-panel-tabs .gp-tab-btn').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.gpTab === tab); });
    renderGroupPanelBody();
}

async function loadGroupPanel(key) {
    var parts = key.split(':'), groupId = parseInt(parts[1]);
    if (!groupId) return;
    try {
        var detailData = await api('GET', '/groups/' + groupId);
        var membersData = await api('GET', '/groups/' + groupId + '/members');
        groupPanelData = {
            group: detailData.group, myRole: detailData.my_role || '',
            isMuted: detailData.is_muted || false,
            members: membersData.members || [],
            dnd: detailData.dnd || false
        };
        groupMembersMap.set(groupId, membersData.members || []);
        groupDNDMap.set(groupId, detailData.dnd || false);
        document.getElementById('gpTitle').textContent = groupPanelData.group.name || '群详情';
        updateDndBtn();
        renderGroupPanelBody();
    } catch(e) {
        document.getElementById('groupPanelBody').innerHTML = '<div class="gp-section" style="color:#e74c3c;text-align:center;padding:20px">加载失败: ' + escapeHtml(e.message) + '</div>';
    }
}

function updateDndBtn() {
    var btn = document.getElementById('gpDndBtn');
    if (!groupPanelData) return;
    btn.textContent = groupPanelData.dnd ? '🔕' : '🔔';
    btn.title = groupPanelData.dnd ? '免打扰中，点击取消' : '消息提醒开启，点击免打扰';
}

function toggleGroupDND() {
    if (!currentGroupPanelKey) return;
    var parts = currentGroupPanelKey.split(':'), groupId = parseInt(parts[1]);
    api('POST', '/groups/' + groupId + '/dnd').then(function(data) {
        groupPanelData.dnd = data.dnd;
        groupDNDMap.set(groupId, data.dnd);
        updateDndBtn();
        renderSidebar(); // 更新侧边栏图标
    }).catch(function(e) { alert('操作失败: ' + e.message); });
}

function renderGroupPanelBody() {
    if (!groupPanelData) return;
    switch (groupPanelActiveTab) {
        case 'info': renderGroupInfo(); break;
        case 'announce': loadGroupAnnouncements(); break;
        case 'members': renderGroupMembers(); break;
    }
}

// ---- 群资料标签 ----
function renderGroupInfo() {
    var g = groupPanelData.group;
    var ownerName = '';
    var om = groupPanelData.members.find(function(m) { return m.user_id === g.owner_id; });
    if (om) ownerName = om.nickname || om.username || ('用户' + g.owner_id);
    else ownerName = '用户' + g.owner_id;
    var createdAt = g.created_at ? new Date(g.created_at).toLocaleString('zh-CN') : '-';

    var html = '<div class="gp-section"><h3>基本信息</h3>' +
        '<div class="gp-row"><span>群名称</span><span>' + escapeHtml(g.name) + '</span></div>' +
        '<div class="gp-row"><span>群主</span><span><a href="/profile?user_id=' + g.owner_id + '" style="color:var(--link-color)">' + escapeHtml(ownerName) + '</a></span></div>' +
        '<div class="gp-row"><span>创建时间</span><span>' + escapeHtml(createdAt) + '</span></div>' +
        '<div class="gp-row"><span>成员数</span><span>' + groupPanelData.members.length + '</span></div>' +
    '</div>';

    // 群简介
    html += '<div class="gp-section"><h3>群简介</h3>' +
        '<div style="color:#666;font-size:14px;white-space:pre-wrap">' + escapeHtml(g.description || '暂无简介') + '</div>' +
    '</div>';

    // 群主可编辑
    if (groupPanelData.myRole === 'owner') {
        html += '<div class="gp-section"><h3>编辑群资料</h3>' +
            '<label class="gp-label">群名称</label>' +
            '<input class="gp-input" id="gpEditName" value="' + escapeHtml(g.name) + '" placeholder="输入新群名称">' +
            '<label class="gp-label">群简介</label>' +
            '<input class="gp-input" id="gpEditDesc" value="' + escapeHtml(g.description || '') + '" placeholder="输入群简介">' +
            '<div class="gp-actions" style="margin-top:8px">' +
                '<button class="gp-btn gp-btn-primary" onclick="saveGroupInfo(' + g.id + ')">保存</button>' +
            '</div>' +
        '</div>';
    }

    document.getElementById('groupPanelBody').innerHTML = html;
}

function saveGroupInfo(groupId) {
    var newName = document.getElementById('gpEditName').value.trim();
    var newDesc = document.getElementById('gpEditDesc').value.trim();
    if (!newName) return;
    api('PUT', '/groups/' + groupId, { name: newName, description: newDesc }).then(function() {
        groupPanelData.group.name = newName;
        groupPanelData.group.description = newDesc;
        var key = 'group:' + groupId;
        var tab = chatTabs.get(key);
        if (tab) { tab.name = newName; tab.tabEl.querySelector('.tab-name').textContent = newName;
            var hSpan = tab.headerEl.querySelector('span'); if (hSpan) hSpan.textContent = newName; }
        var conv = conversations.find(function(c) { return c.key === key; });
        if (conv) conv.name = newName;
        var g = sidebarGroups.find(function(g) { return g.id === groupId; });
        if (g) { g.name = newName; g.description = newDesc; }
        renderSidebar(); renderGroupInfo();
    }).catch(function(e) { alert('保存失败: ' + e.message); });
}

// ---- 群公告标签 ----
async function loadGroupAnnouncements() {
    if (!currentGroupPanelKey) return;
    var parts = currentGroupPanelKey.split(':'), groupId = parseInt(parts[1]);
    try {
        var data = await api('GET', '/groups/' + groupId + '/announcements');
        renderGroupAnnounce(data.announcements || [], groupId);
    } catch(e) {
        document.getElementById('groupPanelBody').innerHTML = '<div class="gp-section" style="color:#e74c3c">加载公告失败: ' + escapeHtml(e.message) + '</div>';
    }
}

function renderGroupAnnounce(announcements, groupId) {
    var html = '';
    // 发布公告表单
    if (groupPanelData.myRole === 'owner' || groupPanelData.myRole === 'admin') {
        html += '<div class="gp-section"><h3>发布公告</h3>' +
            '<textarea class="gp-textarea" id="gpNewAnnounce" placeholder="输入公告内容..."></textarea>' +
            '<div class="gp-actions" style="margin-top:8px">' +
                '<button class="gp-btn gp-btn-primary" onclick="publishAnnounce(' + groupId + ')">发布</button>' +
            '</div>' +
        '</div>';
    }

    // 公告历史
    html += '<div class="gp-section"><h3>公告历史 (' + announcements.length + ')</h3>';
    if (announcements.length === 0) {
        html += '<div style="color:#999;padding:12px">暂无公告</div>';
    } else {
        announcements.forEach(function(a) {
            var time = a.created_at ? new Date(a.created_at).toLocaleString('zh-CN') : '-';
            html += '<div class="announce-item" style="padding:10px;border-bottom:1px solid #eee;margin-bottom:6px">' +
                '<div class="announce-content" style="white-space:pre-wrap;margin-bottom:4px">' + escapeHtml(a.content) + '</div>' +
                '<div style="font-size:11px;color:#999">' + escapeHtml(a.editor || '') + ' · ' + time + '</div>' +
            '</div>';
        });
    }
    html += '</div>';

    document.getElementById('groupPanelBody').innerHTML = html;
}

function publishAnnounce(groupId) {
    var text = document.getElementById('gpNewAnnounce').value.trim();
    if (!text) { alert('公告内容不能为空'); return; }
    api('POST', '/groups/' + groupId + '/announcements', { content: text }).then(function() {
        document.getElementById('gpNewAnnounce').value = '';
        // 同步更新 group.current announce
        groupPanelData.group.announce = text;
        loadGroupAnnouncements();
    }).catch(function(e) { alert('发布失败: ' + e.message); });
}

// ---- 群成员标签 ----
function renderGroupMembers() {
    var myRole = groupPanelData.myRole, myUserId = getUserId();
    var html = '<div class="gp-section"><h3>群成员 (' + groupPanelData.members.length + ')</h3>';

    if (myRole === 'owner' || myRole === 'admin') {
        html += '<div class="gp-row" style="margin-bottom:10px">' +
            '<input type="number" id="gpAddMemberInput" placeholder="输入用户 ID" class="gp-input" style="width:120px;margin:0">' +
            '<button class="gp-btn gp-btn-primary" onclick="addMemberAction(' + groupPanelData.group.id + ')" style="margin-left:6px">添加成员</button>' +
        '</div>';
    }

    groupPanelData.members.forEach(function(m) {
        var displayName = m.nickname || m.username || ('用户' + m.user_id);
        var roleLabel = '', roleCls = '';
        if (m.role === 'owner') { roleLabel = '群主'; roleCls = 'owner'; }
        else if (m.role === 'admin') { roleLabel = '管理员'; roleCls = 'admin'; }
        else { roleLabel = '成员'; roleCls = 'member'; }
        var isMuted = m.muted_until && new Date(m.muted_until) > new Date();
        var dndIcon = m.dnd ? ' 🔕' : '';

        html += '<div class="gp-member-item" data-user-id="' + m.user_id + '">' +
            '<div class="member-info">' +
                '<span>' + escapeHtml(displayName.charAt(0)) + '</span>' +
                '<a href="/profile?user_id=' + m.user_id + '" style="margin-left:6px;color:var(--link-color)" title="查看资料">' + escapeHtml(displayName) + '</a>' +
                '<span class="role-tag ' + roleCls + '">' + roleLabel + '</span>' +
                (isMuted ? '<span class="muted-tag">禁言中</span>' : '') +
                dndIcon +
            '</div><div class="gp-actions">';

        if (m.user_id !== myUserId) {
            if (myRole === 'owner' && m.role !== 'owner') {
                if (isMuted) html += '<button class="gp-btn gp-btn-warn" onclick="unmuteMemberAction(' + groupPanelData.group.id + ',' + m.user_id + ')">解禁</button>';
                else html += '<button class="gp-btn gp-btn-warn" onclick="muteMemberAction(' + groupPanelData.group.id + ',' + m.user_id + ')">禁言</button>';
                html += '<button class="gp-btn gp-btn-danger" onclick="kickMemberAction(' + groupPanelData.group.id + ',' + m.user_id + ')">踢出</button>';
                if (m.role === 'admin') html += '<button class="gp-btn" style="background:#888;color:#fff" onclick="setAdminAction(' + groupPanelData.group.id + ',' + m.user_id + ')">取消管理</button>';
                else html += '<button class="gp-btn" style="background:#2b5f8a;color:#fff" onclick="setAdminAction(' + groupPanelData.group.id + ',' + m.user_id + ')">设管理</button>';
                html += '<button class="gp-btn gp-btn-primary" onclick="transferOwnerAction(' + groupPanelData.group.id + ',' + m.user_id + ')">转让</button>';
            } else if (myRole === 'admin' && m.role === 'member') {
                if (isMuted) html += '<button class="gp-btn gp-btn-warn" onclick="unmuteMemberAction(' + groupPanelData.group.id + ',' + m.user_id + ')">解禁</button>';
                else html += '<button class="gp-btn gp-btn-warn" onclick="muteMemberAction(' + groupPanelData.group.id + ',' + m.user_id + ')">禁言</button>';
                html += '<button class="gp-btn gp-btn-danger" onclick="kickMemberAction(' + groupPanelData.group.id + ',' + m.user_id + ')">踢出</button>';
            }
        }
        html += '</div></div>';
    });

    html += '</div>';
    document.getElementById('groupPanelBody').innerHTML = html;
}

// ---- 群操作函数 ----
function addMemberAction(groupId) { /* ... 同上 ... */
    var userId = parseInt(document.getElementById('gpAddMemberInput').value);
    if (!userId) { alert('请输入有效的用户 ID'); return; }
    api('POST', '/groups/' + groupId + '/add-member', { user_id: userId }).then(function() {
        document.getElementById('gpAddMemberInput').value = ''; reloadGroupPanel();
    }).catch(function(e) { alert('添加失败: ' + e.message); });
}

function kickMemberAction(groupId, userId) {
    if (!confirm('确认踢出该成员？')) return;
    api('POST', '/groups/' + groupId + '/kick', { user_id: userId }).then(function() { reloadGroupPanel(); }).catch(function(e) { alert('操作失败: ' + e.message); });
}

function muteMemberAction(groupId, userId) {
    var minutes = prompt('请输入禁言分钟数:', '10');
    if (!minutes) return;
    minutes = parseInt(minutes); if (!minutes || minutes < 1) return;
    api('POST', '/groups/' + groupId + '/mute', { user_id: userId, minutes: minutes }).then(function() { reloadGroupPanel(); }).catch(function(e) { alert('操作失败: ' + e.message); });
}

function unmuteMemberAction(groupId, userId) {
    api('POST', '/groups/' + groupId + '/unmute', { user_id: userId }).then(function() { reloadGroupPanel(); }).catch(function(e) { alert('操作失败: ' + e.message); });
}

function setAdminAction(groupId, userId) {
    api('PUT', '/groups/' + groupId + '/admin/' + userId).then(function() { reloadGroupPanel(); }).catch(function(e) { alert('操作失败: ' + e.message); });
}

function transferOwnerAction(groupId, userId) {
    if (!confirm('确认将群主转让给该成员？此操作不可撤销。')) return;
    api('PUT', '/groups/' + groupId + '/transfer', { new_owner_id: userId }).then(function() { reloadGroupPanel(); }).catch(function(e) { alert('操作失败: ' + e.message); });
}

function reloadGroupPanel() {
    if (currentGroupPanelKey) {
        loadGroupPanel(currentGroupPanelKey);
        loadGroups().then(function() { buildConversations(); sortConversations(); renderSidebar(); });
    }
}

// ========================================
// 消息提示音控制（免打扰 + @ 提醒）
// ========================================
// 返回 true 表示应该抑制提示音
window.__suppressSound = function(msg) {
    if (!msg.group_id) return false; // 非群消息不抑制
    var groupId = msg.group_id;
    // 免打扰检查
    if (!groupDNDMap.get(groupId)) return false; // 未开启免打扰，正常播放
    // 开启免打扰，检查是否被 @
    if (!msg.mentions) return true; // 无 @ 信息，抑制
    var myId = getUserId();
    try {
        var ids = JSON.parse(msg.mentions);
        if (!Array.isArray(ids) || ids.indexOf(myId) === -1) return true; // 未被 @，抑制
    } catch(e) { return true; }
    return false; // 被 @ 了，不抑制
};

// ========================================
// 消息接收路由
// ========================================
onMessage = function(msg) {
    var myId = getUserId();
    var key;
    if (msg.group_id !== null && msg.group_id !== undefined && msg.group_id !== 0) {
        key = 'group:' + msg.group_id;
    } else if (msg.to_user_id !== null && msg.to_user_id !== undefined && msg.to_user_id !== 0) {
        var peerId = (msg.from_user_id === myId) ? msg.to_user_id : msg.from_user_id;
        key = 'user:' + peerId;
    } else {
        key = 'broadcast';
    }

    lastMessages.set(key, msg);
    lastTimestamps.set(key, new Date(msg.created_at || Date.now()));
    updateSidebarPreview(key, msg);

    // 新会话补充进 conversations
    if (!conversations.find(function(c) { return c.key === key; })) {
        if (key.startsWith('group:')) {
            var gid = parseInt(key.split(':')[1]);
            var g = sidebarGroups.find(function(g) { return g.id === gid; });
            if (g) conversations.push({ key: key, type: 'group', targetId: gid, name: g.name, avatarChar: g.name.charAt(0) });
        } else if (key.startsWith('user:')) {
            var uid = parseInt(key.split(':')[1]);
            var f = sidebarFriends.find(function(f) { return f.friend_id === uid; });
            if (f) {
                var name = f.remark || f.nickname || f.username || ('用户' + uid);
                conversations.push({ key: key, type: 'user', targetId: uid, name: name, avatarChar: name.charAt(0) });
            }
        }
    }

    resortSidebarItem(key);
    if (!document.querySelector('.sidebar-item[data-key="' + key + '"]')) {
        renderSidebar();
        if (activeTabKey) {
            document.querySelectorAll('.sidebar-item').forEach(function(el) { el.classList.toggle('active', el.dataset.key === activeTabKey); });
        }
    }

    if (chatTabs.has(key)) {
        var tab = chatTabs.get(key);
        tab.messages.push(msg);
        if (key === activeTabKey) {
            tab.messagesEl.innerHTML += renderOneMessage(msg);
            tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight;
        } else { unreadCounts.set(key, (unreadCounts.get(key) || 0) + 1); updateTabBadge(key); }
    } else { unreadCounts.set(key, (unreadCounts.get(key) || 0) + 1); }

    updateSidebarBadge(key);
};

// ========================================
// 消息渲染
// ========================================
function renderOneMessage(msg) {
    var isMe = msg.from_user_id === getUserId();
    var cls = isMe ? 'from-me' : '';
    var name = msg.from_user ? (msg.from_user.nickname || msg.from_user.username) : ('用户' + msg.from_user_id);
    return '<div class="msg ' + cls + '">' +
        '<div class="bubble">' +
            '<div class="meta"><a href="/profile?user_id=' + msg.from_user_id + '" style="color:var(--link-color)">' + escapeHtml(name) + '</a></div>' +
            escapeHtml(msg.content) +
        '</div>' +
    '</div>';
}

function renderAllMessages(tab) {
    var html = '';
    for (var i = 0; i < tab.messages.length; i++) html += renderOneMessage(tab.messages[i]);
    tab.messagesEl.innerHTML = html;
}

// ========================================
// 发送消息（含 @ 提及提取）
// ========================================
function sendMessage(key) {
    var tab = chatTabs.get(key || activeTabKey);
    if (!tab) return;
    var content = tab.inputEl.value.trim();
    if (!content) return;

    var msg = { type: 'text', from_user_id: getUserId(), content: content };
    if (tab.type === 'user') { msg.to_user_id = tab.targetId; }
    else if (tab.type === 'group') {
        msg.group_id = tab.targetId;
        // 提取 @ 提及的用户 ID
        var members = groupMembersMap.get(tab.targetId) || [];
        var mentionIds = [];
        var re = /@(\S+)/g;
        var match;
        while ((match = re.exec(content)) !== null) {
            var atName = match[1].toLowerCase();
            var found = members.find(function(m) {
                var dn = (m.nickname || m.username || '').toLowerCase();
                return dn === atName;
            });
            if (found && mentionIds.indexOf(found.user_id) === -1) mentionIds.push(found.user_id);
        }
        if (mentionIds.length > 0) msg.mentions = JSON.stringify(mentionIds);
    }

    sendWS(msg);
    tab.inputEl.value = '';
};

// ========================================
// 历史消息加载
// ========================================
async function loadHistory(key, page) {
    var tab = chatTabs.get(key);
    if (!tab) return;
    page = page || 1;
    var url;
    if (tab.type === 'user') url = '/history?peer_id=' + tab.targetId + '&page=' + page + '&page_size=30';
    else if (tab.type === 'group') url = '/history/group/' + tab.targetId + '?page=' + page + '&page_size=30';
    else url = '/history/broadcast?page=' + page + '&page_size=30';
    try {
        var data = await api('GET', url);
        tab._loading = false;
        if (!data.messages || data.messages.length === 0) { tab.hasMore = false; return; }
        var newMsgs = data.messages.reverse();
        if (page === 1) { tab.messages = newMsgs; renderAllMessages(tab); tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight; }
        else { var oldH = tab.messagesEl.scrollHeight; tab.messages = newMsgs.concat(tab.messages); renderAllMessages(tab); tab.messagesEl.scrollTop = tab.messagesEl.scrollHeight - oldH; }
        tab.historyPage = page + 1;
        if (data.messages.length < 30) tab.hasMore = false;
    } catch(e) { tab._loading = false; console.error(e); }
}

// ========================================
// URL 参数处理
// ========================================
var pendingOpenKey = null, pendingOpenType = null, pendingOpenTarget = null;
var urlParams = new URLSearchParams(window.location.search);
var peerParam = urlParams.get('peer');
var typeParam = urlParams.get('type') || 'user';
if (peerParam) {
    var targetId = parseInt(peerParam);
    pendingOpenType = typeParam === 'group' ? 'group' : 'user';
    pendingOpenTarget = targetId;
    pendingOpenKey = pendingOpenType + ':' + targetId;
}

function escapeHtml(s) {
    var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

// ========================================
// 初始化
// ========================================
async function init() {
    await Promise.all([loadFriends(), loadGroups()]);
    await loadGroupMetadata();
    buildConversations();
    await loadLastMessages();
    sortConversations();
    renderSidebar();
    if (pendingOpenKey) {
        var conv = conversations.find(function(c) { return c.key === pendingOpenKey; });
        var name = conv ? conv.name : ('用户' + pendingOpenTarget);
        openOrSwitchTab(pendingOpenKey, pendingOpenType, pendingOpenTarget, name);
    }
}

loadAndApplySettings();
init();
</script>
