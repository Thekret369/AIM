services:
  lanline:
    environment:
      LANLINE_DATABASE_DRIVER: mysql
      LANLINE_DATABASE_DSN: ${LANLINE_DATABASE_DSN:-lanline:lanline_local_password@tcp(mysql:3306)/lanline?charset=utf8mb4&parseTime=True&loc=Local}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: ${LANLINE_MYSQL_IMAGE:-mysql:8.4}
    container_name: ${LANLINE_MYSQL_CONTAINER_NAME:-lanline-mysql}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${LANLINE_MYSQL_DATABASE:-lanline}
      MYSQL_USER: ${LANLINE_MYSQL_USER:-lanline}
      MYSQL_PASSWORD: ${LANLINE_MYSQL_PASSWORD:-lanline_local_password}
      MYSQL_ROOT_PASSWORD: ${LANLINE_MYSQL_ROOT_PASSWORD:-lanline_local_root_password}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${LANLINE_MYSQL_PORT:-3306}:3306"
    volumes:
      - lanline_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lanline_net

volumes:
  lanline_mysql:
    name: ${LANLINE_MYSQL_VOLUME:-lanline_mysql}

networks:
  lanline_net:
    name: ${LANLINE_NETWORK:-lanline_net}
    driver: bridge
