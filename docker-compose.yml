name: lanline

services:
  lanline:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22}
    image: ${LANLINE_IMAGE:-lanline:local}
    container_name: ${LANLINE_CONTAINER_NAME:-lanline}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LANLINE_PORT:-8080}:8080"
    environment:
      LANLINE_SERVER_HOST: 0.0.0.0
      LANLINE_SERVER_PORT: 8080
      LANLINE_DATABASE_DRIVER: ${LANLINE_DATABASE_DRIVER:-sqlite}
      LANLINE_DATABASE_DSN: ${LANLINE_DATABASE_DSN:-/app/data/lanline.db}
      LANLINE_JWT_SECRET: ${LANLINE_JWT_SECRET:?set LANLINE_JWT_SECRET in .env}
      LANLINE_JWT_EXPIRE_HOURS: ${LANLINE_JWT_EXPIRE_HOURS:-72}
      LANLINE_LOG_LEVEL: ${LANLINE_LOG_LEVEL:-info}
      LANLINE_LOG_FILE: ${LANLINE_LOG_FILE:-/app/logs/lanline.log}
      LANLINE_AI_ENABLED: ${LANLINE_AI_ENABLED:-true}
      LANLINE_AI_BASE_URL: ${LANLINE_AI_BASE_URL:-}
      LANLINE_AI_API_KEY: ${LANLINE_AI_API_KEY:-}
      LANLINE_AI_API_KEY_ENV: ${LANLINE_AI_API_KEY_ENV:-LANLINE_AI_API_KEY}
      LANLINE_AI_API_KEY_ENCRYPT_KEY: ${LANLINE_AI_API_KEY_ENCRYPT_KEY:-}
      LANLINE_AI_API_KEY_ENCRYPT_KEY_ENV: ${LANLINE_AI_API_KEY_ENCRYPT_KEY_ENV:-LANLINE_AI_API_KEY_ENCRYPT_KEY}
      LANLINE_AI_DEFAULT_MODEL: ${LANLINE_AI_DEFAULT_MODEL:-}
      LANLINE_AI_DEFAULT_BOT_USERNAME: ${LANLINE_AI_DEFAULT_BOT_USERNAME:-ai_assistant}
      LANLINE_AI_DEFAULT_BOT_NICKNAME: ${LANLINE_AI_DEFAULT_BOT_NICKNAME:-蓝妹}
      LANLINE_AI_SYSTEM_PROMPT: ${LANLINE_AI_SYSTEM_PROMPT:-}
      LANLINE_AI_TIMEOUT_SECONDS: ${LANLINE_AI_TIMEOUT_SECONDS:-60}
      LANLINE_AI_MAX_CONTEXT_MESSAGES: ${LANLINE_AI_MAX_CONTEXT_MESSAGES:-12}
      LANLINE_AI_TEMPERATURE: ${LANLINE_AI_TEMPERATURE:-0.7}
      LANLINE_AI_MAX_TOKENS: ${LANLINE_AI_MAX_TOKENS:-1024}
    volumes:
      - lanline_data:/app/data
      - lanline_logs:/app/logs
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 -O /dev/null "http://127.0.0.1:$${LANLINE_SERVER_PORT:-8080}/login" || exit 1
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lanline_net

volumes:
  lanline_data:
    name: ${LANLINE_DATA_VOLUME:-lanline_data}
  lanline_logs:
    name: ${LANLINE_LOGS_VOLUME:-lanline_logs}

networks:
  lanline_net:
    name: ${LANLINE_NETWORK:-lanline_net}
    driver: bridge
