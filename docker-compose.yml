name: aim

services:
  aim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22}
    image: ${AIM_IMAGE:-aim:local}
    container_name: ${AIM_CONTAINER_NAME:-aim}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${AIM_PORT:-8080}:8080"
    environment:
      AIM_SERVER_HOST: 0.0.0.0
      AIM_SERVER_PORT: 8080
      AIM_DATABASE_DRIVER: ${AIM_DATABASE_DRIVER:-sqlite}
      AIM_DATABASE_DSN: ${AIM_DATABASE_DSN:-/app/data/aim.db}
      AIM_JWT_SECRET: ${AIM_JWT_SECRET:?set AIM_JWT_SECRET in .env}
      AIM_JWT_EXPIRE_HOURS: ${AIM_JWT_EXPIRE_HOURS:-72}
      AIM_LOG_LEVEL: ${AIM_LOG_LEVEL:-info}
      AIM_LOG_FILE: ${AIM_LOG_FILE:-/app/logs/aim.log}
      AIM_AI_ENABLED: ${AIM_AI_ENABLED:-true}
      AIM_AI_BASE_URL: ${AIM_AI_BASE_URL:-}
      AIM_AI_API_KEY: ${AIM_AI_API_KEY:-}
      AIM_AI_API_KEY_ENV: ${AIM_AI_API_KEY_ENV:-AIM_AI_API_KEY}
      AIM_AI_API_KEY_ENCRYPT_KEY: ${AIM_AI_API_KEY_ENCRYPT_KEY:-}
      AIM_AI_API_KEY_ENCRYPT_KEY_ENV: ${AIM_AI_API_KEY_ENCRYPT_KEY_ENV:-AIM_AI_API_KEY_ENCRYPT_KEY}
      AIM_AI_DEFAULT_MODEL: ${AIM_AI_DEFAULT_MODEL:-}
      AIM_AI_DEFAULT_BOT_USERNAME: ${AIM_AI_DEFAULT_BOT_USERNAME:-ai_assistant}
      AIM_AI_DEFAULT_BOT_NICKNAME: ${AIM_AI_DEFAULT_BOT_NICKNAME:-蓝妹}
      AIM_AI_SYSTEM_PROMPT: ${AIM_AI_SYSTEM_PROMPT:-}
      AIM_AI_TIMEOUT_SECONDS: ${AIM_AI_TIMEOUT_SECONDS:-60}
      AIM_AI_MAX_CONTEXT_MESSAGES: ${AIM_AI_MAX_CONTEXT_MESSAGES:-12}
      AIM_AI_TEMPERATURE: ${AIM_AI_TEMPERATURE:-0.7}
      AIM_AI_MAX_TOKENS: ${AIM_AI_MAX_TOKENS:-1024}
    volumes:
      - aim_data:/app/data
      - aim_logs:/app/logs
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 -O /dev/null "http://127.0.0.1:$${AIM_SERVER_PORT:-8080}/login" || exit 1
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aim_net

volumes:
  aim_data:
    name: ${AIM_DATA_VOLUME:-aim_data}
  aim_logs:
    name: ${AIM_LOGS_VOLUME:-aim_logs}

networks:
  aim_net:
    name: ${AIM_NETWORK:-aim_net}
    driver: bridge
